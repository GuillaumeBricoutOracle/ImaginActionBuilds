}

function modTab(btn, tabId, modName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  ['t-cls','t-files','t-docs','t-deps','t-graph'].forEach(id => {
    const el = $(id);
    if (el) el.style.display = id === tabId ? '' : 'none';
  });
  if (tabId === 't-graph' && modName) renderModuleIntraGraph(modName);
}

function renderModuleIntraGraph(name) {
  const container = $('t-graph');
  if (!container) return;
  const intraDeps = D.dependencies.filter(d => d.fromMod === name && d.toMod === name);
  if (!intraDeps.length) {
    container.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:16px">Aucun couplage interne détecté entre les classes de ce module.</p>';
    return;
  }
  const mod = D.modules.find(m => m.name === name);
  const nodeIds = new Set();
  intraDeps.forEach(d => { nodeIds.add(d.from); nodeIds.add(d.to); });

  const fanIn  = {}, fanOut = {};
  intraDeps.forEach(d => {
    fanOut[d.from] = (fanOut[d.from] || 0) + 1;
    fanIn[d.to]    = (fanIn[d.to]   || 0) + 1;
  });

  const maxFan = Math.max(...Object.values({...fanIn,...fanOut}), 1);
  const clsMap = {};
  (mod?.classes || D.classes.filter(c => c.module === name)).forEach(c => clsMap[c.name] = c);

  const C = { surf:'#2f3350', surf2:'#24283b', border:'#414868', text:'#c0caf5', cyan:'#7dcfff', yellow:'#e0af68', orange:'#ff9e64' };
  const nodes = [...nodeIds].map(id => {
    const out = fanOut[id] || 0;
    const inp = fanIn[id]  || 0;
    const heat = (out + inp) / (maxFan * 2);
    const borderCol = heat > 0.6 ? C.orange : heat > 0.3 ? C.yellow : C.cyan;
    return {
      id, label: id,
      title: `↗${out} sortant · ↙${inp} entrant`,
      color: { background: C.surf, border: borderCol, highlight: { background: C.surf2, border: borderCol } },
      font: { color: C.text, size: 12 },
      shape: 'box', margin: 8, borderWidth: 2,
    };
  });
  const edges = intraDeps.map((d,i) => ({
    id: i, from: d.from, to: d.to,
    arrows: 'to',
    color: { color: C.border, highlight: C.cyan, opacity: 0.9 },
    smooth: { type: 'curvedCW', roundness: 0.15 },
    title: d.type || '',
  }));

  container.innerHTML = '';
  container.style.background = C.surf2;
  const net = new vis.Network(container,
    { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) },
    {
      layout: { improvedLayout: true },
      physics: { solver:'forceAtlas2Based', forceAtlas2Based:{ gravitationalConstant:-80, springLength:100, springConstant:0.05 }, stabilization:{ iterations:250 } },
      interaction: { hover:true, tooltipDelay:150, navigationButtons:false },
      edges: { smooth:{ type:'curvedCW', roundness:0.15 } },
    }
  );
  net.on('click', p => {
    if (p.nodes.length) go('class', { n: p.nodes[0] });
  });
}

// ── Classe ────────────────────────────────────────────────────────────────────
function renderClass(name) {
  const c = D.classes.find(x => x.name === name);
  if (!c) return;

  const usedBy         = D.dependencies.filter(d => d.to === name);
  const uses           = D.dependencies.filter(d => d.from === name);
  const publicMethods  = (c.methods || []).filter(m => m.access === 'public');
  const otherMethods   = (c.methods || []).filter(m => m.access !== 'public');

  $('main').innerHTML = `
    <button class="back" onclick="go('module',{n:'${c.module||''}'})">← ${c.module||'Retour'}</button>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span class="kbadge ${kindCss(c)}">${c.kind}</span>
      <h1 class="ph" style="margin:0">${c.name}</h1>
    </div>

    ${c.description ? `
      <div class="card">
        <pre style="background:none;border:none;padding:0;font-family:inherit;
             font-size:13px;white-space:pre-wrap;color:var(--muted);line-height:1.65">${esc(c.description)}</pre>
      </div>` : ''}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
      ${(c.inherits?.length || c.implements?.length) ? `
      <div class="card">
        <div class="card-t">Relations</div>
        ${(c.inherits||[]).map(p => `
          <div style="margin-bottom:7px;font-size:13px">
            <span style="color:var(--muted);font-size:11px">hérite de </span>
            <span class="rtag inherits" onclick="go('class',{n:'${p}'})">${p}</span>
          </div>`).join('')}
        ${(c.implements||[]).map(i => `
          <div style="margin-bottom:7px;font-size:13px">
            <span style="color:var(--muted);font-size:11px">implémente </span>
            <span class="rtag implements" onclick="go('class',{n:'${i}'})">${i}</span>
          </div>`).join('')}
      </div>` : ''}

      <div class="card">
        <div class="card-t">Fichier source</div>
        <div class="fentry" onclick="go('file',{path:'${c.file}',mod:'${c.module||''}'})">
          <span>${(c.file||'').split('/').pop()}</span>
        </div>
        ${c.module ? `
          <div style="margin-top:8px;font-size:12px;color:var(--muted)">
            Module :
            <span style="color:${col(c.module)};cursor:pointer"
                  onclick="go('module',{n:'${c.module}'})">${c.module}</span>
          </div>` : ''}
      </div>
    </div>

    ${usedBy.length ? `
    <div class="card" style="margin-top:10px">
      <div class="card-t">Utilisé par</div>
      <div class="rtags">
        ${usedBy.map(d => `
          <span class="rtag ${d.type}" onclick="go('class',{n:'${d.from}'})">${d.from}</span>`).join('')}
      </div>
    </div>` : ''}

    ${uses.length ? `
    <div class="card" style="margin-top:10px">
      <div class="card-t">Utilise</div>
      <div class="rtags">
        ${uses.map(d => `
          <span class="rtag ${d.type}" onclick="go('class',{n:'${d.to}'})">${d.to}</span>`).join('')}
      </div>
    </div>` : ''}

    ${(() => {
      // Impact analysis — reverse BFS
      const revAdj = {};
      D.dependencies.forEach(d => {
        revAdj[d.to] = revAdj[d.to] || new Set();
        revAdj[d.to].add(d.from);
      });
      const impacted = new Set();
      const queue = [name];
      while (queue.length) {
        const n = queue.pop();
        for (const nb of (revAdj[n] || [])) {
          if (!impacted.has(nb)) { impacted.add(nb); queue.push(nb); }
        }
      }
      impacted.delete(name);
      if (!impacted.size) return '';
      const direct = new Set(usedBy.map(d => d.from));
      const indirect = [...impacted].filter(x => !direct.has(x));
      return `
      <div class="card" style="margin-top:10px;border-color:var(--yellow)30">
        <div class="card-t" style="display:flex;align-items:center;gap:8px">
          Analyse d'impact
          <span style="font-size:10px;background:var(--yellow)22;color:var(--yellow);padding:1px 6px;border-radius:8px">${impacted.size} classe${impacted.size>1?'s':''} affectée${impacted.size>1?'s':''}</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Modifier <strong style="color:var(--text)">${name}</strong> peut casser ces classes :</div>
        ${direct.size ? `
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Direct (${direct.size})</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">
            ${[...direct].map(n => `<span class="rtag uses" style="cursor:pointer" onclick="go('class',{n:'${n}'})">${n}</span>`).join('')}
          </div>` : ''}
        ${indirect.length ? `
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Indirect (${indirect.length})</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${indirect.slice(0,24).map(n => `<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:var(--border);color:var(--muted);cursor:pointer" onclick="go('class',{n:'${n}'})">${n}</span>`).join('')}
            ${indirect.length > 24 ? `<span style="font-size:10px;color:var(--border)">+${indirect.length-24} autres</span>` : ''}
          </div>` : ''}
      </div>`;
    })()}

    ${(() => {
      // Prefabs contenant ce script
      const myPrefabs = (D.prefabs || []).filter(p => p.scripts.includes(name));
      if (!myPrefabs.length) return '';
      return `
      <div class="card" style="margin-top:10px">
        <div class="card-t">Prefabs (${myPrefabs.length})</div>
        ${myPrefabs.map(p => `
          <div class="fentry">
            <span class="fext">.prefab</span>
            <span>${p.name}</span>
            <span class="fpath">${p.path.split('/').slice(0,-1).join('/')}</span>
          </div>`).join('')}
      </div>`;
    })()}

    ${(() => {
      // Assets ScriptableObject instances
      const myAssets = (D.soAssets || []).filter(a => a.scriptClass === name);
      if (!myAssets.length) return '';
      return `
      <div class="card" style="margin-top:10px">
        <div class="card-t">Assets ScriptableObject (${myAssets.length})</div>
        ${myAssets.map(a => `
          <div class="fentry">
            <span class="fext">.asset</span>
            <span>${a.name}</span>
            <span class="fpath">${a.path.split('/').slice(0,-1).join('/')}</span>
          </div>`).join('')}
      </div>`;
    })()}

    ${publicMethods.length ? `
    <div class="card" style="margin-top:10px">
      <div class="card-t">Méthodes publiques <small style="font-weight:400;color:var(--muted)">(${publicMethods.length})</small></div>
      ${publicMethods.map(methodRow).join('')}
    </div>` : ''}

    ${otherMethods.length ? `
    <div class="card" style="margin-top:10px">
      <div class="card-t">Méthodes privées / protégées <small style="font-weight:400;color:var(--muted)">(${otherMethods.length})</small></div>
      ${otherMethods.map(methodRow).join('')}
    </div>` : ''}

    <div class="card" style="margin-top:10px">
      <div class="card-t" style="display:flex;align-items:center;justify-content:space-between">
        <span>Références dans le code</span>
        <button class="back" id="refs-btn" onclick="loadRefs('${name}')"
                style="margin:0;font-size:11px">Charger</button>
      </div>
      <div id="refs-result" style="margin-top:8px;font-size:12px;color:var(--muted)">
        Cliquer sur Charger pour rechercher toutes les occurrences dans les .cs
      </div>
    </div>`;
}

async function loadRefs(name) {
  $('refs-btn').disabled = true;
  $('refs-btn').textContent = '…';
  $('refs-result').innerHTML = '<span style="color:var(--muted)">Recherche en cours…</span>';
  try {
    const r = await fetch('/api/refs?name=' + encodeURIComponent(name));
    const d = await r.json();
    if (!d.results?.length) {
      $('refs-result').innerHTML = '<span style="color:var(--muted)">Aucune référence trouvée.</span>';
      return;
    }
    const total = d.results.reduce((s, f) => s + f.matches.length, 0);
    $('refs-result').innerHTML = `
      <div style="color:var(--muted);margin-bottom:8px">${total} occurrence${total>1?'s':''} dans ${d.results.length} fichier${d.results.length>1?'s':''}</div>
      ${d.results.map(f => `
        <div class="refs-file">
          <div class="refs-fname" onclick="go('file',{path:'${f.file}',mod:''})">${f.file}</div>
          ${f.matches.slice(0, 8).map(m => `
            <div class="refs-line">L${m.line} &nbsp;${esc(m.text).replace(
              new RegExp('\\b' + name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b', 'g'),
              `<em>${name}</em>`
            )}</div>`).join('')}
          ${f.matches.length > 8 ? `<div style="font-size:11px;color:var(--border);padding:2px 8px">+${f.matches.length-8} lignes</div>` : ''}
        </div>`).join('')}`;
  } catch(e) {
    $('refs-result').innerHTML = `<span style="color:var(--red)">Erreur : ${e.message}</span>`;
  } finally {
    if ($('refs-btn')) { $('refs-btn').disabled = false; $('refs-btn').textContent = 'Actualiser'; }
  }
}

// ── Docs CRUD ─────────────────────────────────────────────────────────────────
function showNewDocForm(modName) {
  const form = $('new-doc-form');
  if (form) { form.style.display = ''; $('new-doc-name').focus(); }
}

function hideNewDocForm() {
  const form = $('new-doc-form');
  if (form) form.style.display = 'none';
}

async function saveNewDoc(modName) {
  const name = $('new-doc-name').value.trim().replace(/\.md$/i, '');
  if (!name) { $('new-doc-name').focus(); return; }
  const content = $('new-doc-content').value;
  const mod = D.modules.find(m => m.name === modName);
  if (!mod) return;
  const modRelPath = mod.path.replace(/^Assets\//, '');
  const filePath   = `${modRelPath}/${name}.md`;
  try {
    const r = await fetch('/api/file-write', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: filePath, content})
    });
    const d = await r.json();
    if (d.error) { alert('Erreur : ' + d.error); return; }
    const r2 = await fetch('/api/scan');
    D = await r2.json();
    D.modules.forEach(m => col(m.name));
    renderSidebar();
    go('module', {n: modName});
    _switchToDocsTab();
  } catch(e) { alert('Erreur : ' + e.message); }
}

async function confirmDeleteDoc(path, mod) {
  const fname = path.split('/').pop();
  if (!confirm(`Supprimer "${fname}" ?`)) return;
  try {
    const r = await fetch('/api/file-delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path})
    });
    const d = await r.json();
    if (d.error) { alert('Erreur : ' + d.error); return; }
    const r2 = await fetch('/api/scan');
    D = await r2.json();
    D.modules.forEach(m => col(m.name));
    renderSidebar();
    if (mod) { go('module', {n: mod}); _switchToDocsTab(); }
    else go('home');
  } catch(e) { alert('Erreur : ' + e.message); }
}

function openFileEdit(path, mod) {
  OPEN_IN_EDIT = true;
  go('file', {path, mod});
}

function _switchToDocsTab() {
  const docsBtn = Array.from(document.querySelectorAll('.tab'))
    .find(b => b.getAttribute('onclick')?.includes('t-docs'));
  if (docsBtn) modTab(docsBtn, 't-docs');
}

// ── Classes ───────────────────────────────────────────────────────────────────
// ── Analyse (dead code + cycles) ──────────────────────────────────────────────
const _UNITY_PARENTS = new Set(['MonoBehaviour','ScriptableObject','EditorWindow','Editor']);
const _isUnityEntry  = c => (c.inherits||[]).some(p => _UNITY_PARENTS.has(p));

// Catégorie de couplage d'un module — retourne { lbl, col, advice }
function _coupling(h) {
  const ce = h.ce || 0, ca = h.ca || 0, i = h.instability || 0;
  if (ce === 0 && ca === 0)
    return { lbl:'Autonome',             col:'var(--muted)',
             advice:'' };
  if (ce >  0 && ca === 0)
    return { lbl:'Application',          col:'var(--muted)',
             advice:'Module feuille — normal. Aucun autre module ne dépend de lui. Vérifier seulement qu\'il est bien utilisé depuis Unity.' };
  if (ce === 0 && ca >  0)
    return { lbl:'Fondation',            col:'var(--cyan)',
             advice:`Module noyau utilisé par ${ca} autre${ca>1?'s':''} module${ca>1?'s':''}. Éviter d'y ajouter des dépendances sortantes : toute modification se propage.` };
  if (i < 0.4)
    return { lbl:'Fondation dépendante', col:'var(--yellow)',
             advice:`Noyau (${ca} utilisateur${ca>1?'s':''}) qui dépend lui-même de ${ce} module${ce>1?'s':''}. Risqué : envisager d'extraire les dépendances sortantes dans un module séparé.` };
  if (i > 0.6)
    return { lbl:'Couplé',              col:'var(--orange)',
             advice:`Couplé dans les deux sens (Ce=${ce}, Ca=${ca}). C'est le cas le plus problématique. Introduire une interface ou abstraire une partie pour casser ce couplage bidirectionnel.` };
  return   { lbl:'Équilibré',           col:'var(--green)',
             advice:`Couplage équilibré entre dépendances sortantes (${ce}) et entrantes (${ca}). Surveiller si le rapport évolue.` };
}

function analyseClsRow(c, kind) {
  const badge = kind === 'island'
    ? `<span style="font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px;background:var(--orange)22;color:var(--orange)" title="Référencé mais non atteignable par BFS (îlot isolé)">⬡ îlot</span>`
    : kind === 'dead'
    ? `<span style="font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px;background:var(--red)22;color:var(--red)">◎ dead</span>`
    : `<span style="font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px;background:var(--yellow)22;color:var(--yellow)">⚠ Unity</span>`;
  return `
    <li class="cli" onclick="go('class',{n:'${c.name}'})">
      <span class="kbadge ${kindCss(c)}">${c.kind}</span>
      <span class="cli-name">${c.name}</span>
      ${badge}
      ${c.module ? `<span class="mod-chip" style="background:${col(c.module)}22;color:${col(c.module)}">${c.module}</span>` : ''}
      ${c.description ? `<span style="color:var(--muted);font-size:11px;margin-left:6px">${esc(c.description.split('\n')[0].substring(0,60))}…</span>` : ''}
    </li>`;
}

// ── Ressources (Prefabs + Fichiers) ──────────────────────────────────────────
function renderRessources(tab) {
  tab = tab || 'prefabs';
  $('main').innerHTML =
    '<h1 class="ph">Ressources</h1>'
    + '<div class="tabs" style="margin-bottom:14px">'
    + '<button class="tab' + (tab==='prefabs'?' on':'') + '" onclick="renderRessources(\'prefabs\')">Prefabs</button>'
    + '<button class="tab' + (tab==='files'?' on':'') + '" onclick="renderRessources(\'files\')">Fichiers runtime</button>'
    + '<button class="tab' + (tab==='scenes'?' on':'') + '" onclick="renderRessources(\'scenes\')">Scènes</button>'
    + '</div>'
    + '<div id="res-content"></div>';
  if (tab === 'prefabs')      _renderPrefabsInto('res-content');
  else if (tab === 'scenes')  _renderScenesInto('res-content');
  else                        _renderFilesInto('res-content');
}

function _renderPrefabsInto(targetId) {
  const prefabs = D.prefabs || [];
  const withScripts = prefabs.filter(p => p.scripts.length);
  const empty       = prefabs.filter(p => !p.scripts.length);

  // Build reverse index: script → prefabs
  const scriptToPrefabs = {};
  withScripts.forEach(p => p.scripts.forEach(s => {
    scriptToPrefabs[s] = scriptToPrefabs[s] || [];
    scriptToPrefabs[s].push(p);
  }));

  $(targetId).innerHTML = `
    <div class="stats" style="margin-bottom:18px">
      <div class="stat"><div class="stat-n">${prefabs.length}</div><div class="stat-l">Prefabs</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--cyan)">${withScripts.length}</div><div class="stat-l">Avec scripts</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--muted)">${empty.length}</div><div class="stat-l">Sans script connu</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--accent)">${Object.keys(scriptToPrefabs).length}</div><div class="stat-l">Scripts référencés</div></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-t">Par prefab</div>
      ${withScripts.map(p => `
        <div style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
            <span class="fext">.prefab</span>
            <strong style="font-size:13px">${p.name}</strong>
            <span style="font-size:10px;color:var(--muted)">${p.path.split('/').slice(0,-1).join('/')}</span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;padding-left:4px">
            ${p.scripts.map(s => {
              const cls = D.classes.find(c => c.name === s);
              return `<span class="rtag ${cls ? kindCss(cls) : 'uses'}" style="cursor:pointer" onclick="go('class',{n:'${s}'})">${s}</span>`;
            }).join('')}
          </div>
        </div>`).join('')}
      ${empty.length ? `
        <details style="margin-top:8px">
          <summary style="font-size:11px;color:var(--muted);cursor:pointer">${empty.length} prefab${empty.length>1?'s':''} sans script reconnu</summary>
          <div style="padding-top:6px">
            ${empty.map(p => `<div class="fentry"><span class="fext">.prefab</span><span>${p.name}</span><span class="fpath">${p.path.split('/').slice(0,-1).join('/')}</span></div>`).join('')}
          </div>
        </details>` : ''}
    </div>

    <div class="card">
      <div class="card-t">Par script</div>
      ${Object.entries(scriptToPrefabs).sort((a,b) => b[1].length - a[1].length).map(([s, ps]) => `
        <div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="rtag uses" style="cursor:pointer;flex-shrink:0" onclick="go('class',{n:'${s}'})">${s}</span>
          <span style="font-size:10px;color:var(--muted)">dans</span>
          ${ps.map(p => `<span style="font-size:11px;color:var(--accent)">${p.name}</span>`).join('<span style="color:var(--border)"> · </span>')}
        </div>`).join('')}
    </div>`;
}

// ── Vue par scène ─────────────────────────────────────────────────────────────
function _renderScenesInto(targetId) {
  const el = $(targetId);
  el.innerHTML = '<div style="color:var(--muted);padding:32px 0;text-align:center;font-size:13px">Chargement des scènes…</div>';

  fetch('/api/scenes').then(r => r.json()).then(scenes => {
    const classMap = {};
    (D.classes || []).forEach(c => { classMap[c.name] = c; });

    // Extract module from path: "Modules/Context/…/Foo.cs" → "Context"
    function moduleOf(path) {
      const parts = path.split('/');
      return (parts[0] === 'Modules' && parts.length > 1) ? parts[1] : (parts[0] || '?');
    }

    // All unique modules (sorted)
    const allModules = [...new Set(scenes.flatMap(sc => sc.scripts.map(moduleOf)))].sort();

    // script → scenes cross-ref
    const scriptToScenes = {};
    scenes.forEach(sc => sc.scripts.forEach(s => {
      const base = s.split('/').pop().replace('.cs', '');
      scriptToScenes[base] = scriptToScenes[base] || [];
      if (!scriptToScenes[base].includes(sc.name)) scriptToScenes[base].push(sc.name);
    }));

    // ── helpers ──────────────────────────────────────────────────────────────
    function scriptTag(path) {
      const base = path.split('/').pop().replace('.cs', '');
      const cls  = classMap[base];
      return '<span class="rtag ' + (cls ? kindCss(cls) : 'uses') + '" style="cursor:pointer" '
        + 'onclick="go(\'class\',{n:\'' + base + '\'})">' + base + '</span>';
    }
    function prefabTag(path) {
      const name = path.split('/').pop().replace('.prefab','').replace('.fbx','');
      return '<span style="font-size:10px;background:var(--surface2);border:1px solid var(--border);'
        + 'padding:1px 7px;border-radius:4px;color:var(--muted)">' + esc(name) + '</span>';
    }
    function sceneBadge(name) {
      return '<span style="font-size:10px;background:rgba(122,162,247,.15);border:1px solid #7aa2f755;'
        + 'padding:1px 7px;border-radius:4px;color:var(--accent)">' + esc(name) + '</span>';
    }
    // Module header chip (colored per module index for variety)
    const MOD_COLORS = ['#7aa2f7','#9ece6a','#e0af68','#bb9af7','#73daca','#f7768e','#7dcfff','#ff9e64'];
    function modColor(mod) { return MOD_COLORS[allModules.indexOf(mod) % MOD_COLORS.length]; }

    // ── render ───────────────────────────────────────────────────────────────
    let mode = 'scene';
    function render(m) {
      mode = m;
      const modeBar = '<div style="display:flex;gap:6px;margin-bottom:16px">'
        + ['scene','matrix','script'].map(v => {
          const labels = {scene:'Par scène', matrix:'Matrice', script:'Par script'};
          return '<button onclick="_scenesMode(\'' + v + '\')" class="tab' + (mode===v?' on':'') + '">' + labels[v] + '</button>';
        }).join('')
        + '</div>';

      const stats = '<div class="stats" style="margin-bottom:18px">'
        + '<div class="stat"><div class="stat-n">' + scenes.length + '</div><div class="stat-l">Scènes</div></div>'
        + '<div class="stat"><div class="stat-n" style="color:var(--cyan)">' + Object.keys(scriptToScenes).length + '</div><div class="stat-l">Scripts uniques</div></div>'
        + '<div class="stat"><div class="stat-n" style="color:var(--purple)">' + allModules.length + '</div><div class="stat-l">Modules</div></div>'
        + '</div>';

      let body = '';

      // ── mode : par scène (groupé par module) ─────────────────────────────
      if (mode === 'scene') {
        body = scenes.map(sc => {
          const byMod = {};
          sc.scripts.forEach(p => {
            const mod = moduleOf(p);
            byMod[mod] = byMod[mod] || [];
            byMod[mod].push(p);
          });
          const modEntries = Object.entries(byMod).sort((a,b) => a[0].localeCompare(b[0]));
          const extraP = sc.unresolved_prefabs
            ? ' <span style="font-size:10px;color:var(--muted)">+' + sc.unresolved_prefabs + ' non résolus</span>' : '';

          return '<div class="card" style="margin-bottom:12px">'
            + '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px">'
            +   '<span class="fext">.unity</span>'
            +   '<strong style="font-size:14px">' + esc(sc.name) + '</strong>'
            +   '<span style="font-size:11px;color:var(--muted);font-family:monospace">' + esc(sc.path.split('/').slice(0,-1).join('/')) + '/</span>'
            + '</div>'
            + (modEntries.length
              ? modEntries.map(([mod, paths]) =>
                  '<div style="margin-bottom:10px">'
                  + '<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">'
                  +   '<span style="width:3px;height:14px;border-radius:2px;background:' + modColor(mod) + ';flex-shrink:0;display:inline-block"></span>'
                  +   '<span style="font-size:9px;font-weight:700;letter-spacing:.8px;color:' + modColor(mod) + '">' + esc(mod.toUpperCase()) + '</span>'
                  +   '<span style="font-size:10px;color:var(--muted)">(' + paths.length + ')</span>'
                  + '</div>'
                  + '<div style="display:flex;flex-wrap:wrap;gap:4px;padding-left:9px">' + paths.map(scriptTag).join('') + '</div>'
                  + '</div>'
                ).join('')
              : '<div style="font-size:11px;color:var(--muted);margin-bottom:10px">Aucun script projet</div>')
            + (sc.prefabs.length
              ? '<details style="margin-top:4px"><summary style="font-size:10px;color:var(--muted);cursor:pointer">Prefabs (' + sc.prefabs.length + ')' + extraP + '</summary>'
              +   '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">' + sc.prefabs.map(prefabTag).join('') + '</div>'
              + '</details>' : '')
            + '</div>';
        }).join('');

      // ── mode : matrice modules × scènes ──────────────────────────────────
      } else if (mode === 'matrix') {
        // Matrix: rows=modules, cols=scenes; cell = count of scripts from that module in that scene
        const shortName = n => n.replace(/^SC_/, '').replace(/^AL_/, 'AL:');
        const matrix = {};
        allModules.forEach(mod => {
          matrix[mod] = {};
          scenes.forEach(sc => {
            matrix[mod][sc.name] = sc.scripts.filter(p => moduleOf(p) === mod).length;
          });
        });
        // Only show modules that appear in at least one scene
        const activeModules = allModules.filter(mod => scenes.some(sc => matrix[mod][sc.name] > 0));
        const maxVal = Math.max(1, ...activeModules.flatMap(mod => scenes.map(sc => matrix[mod][sc.name])));

        const cellStyle = (count) => {
          if (count === 0) return 'padding:6px 10px;text-align:center;color:var(--border);font-size:11px;border:1px solid var(--border);background:transparent';
          const t = count / maxVal;
          const alpha = (0.15 + t * 0.65).toFixed(2);
          return 'padding:6px 10px;text-align:center;font-size:11px;font-weight:700;border:1px solid var(--border);background:rgba(122,162,247,' + alpha + ');color:var(--fg)';
        };

        const thStyle = 'padding:6px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--muted);border:1px solid var(--border);background:var(--surface2);white-space:nowrap';
        const modThStyle = 'padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.5px;border:1px solid var(--border);background:var(--surface2);white-space:nowrap;text-align:left';

        body = '<div style="overflow-x:auto">'
          + '<table style="border-collapse:collapse;width:100%;font-size:11px">'
          + '<thead><tr>'
          + '<th style="' + modThStyle + ';color:var(--muted)">Module</th>'
          + scenes.map(sc =>
              '<th style="' + thStyle + '" title="' + esc(sc.name) + '">' + esc(shortName(sc.name)) + '</th>'
            ).join('')
          + '<th style="' + thStyle + '">Total</th>'
          + '</tr></thead><tbody>'
          + activeModules.map(mod => {
              const rowTotal = scenes.reduce((s, sc) => s + matrix[mod][sc.name], 0);
              const col = modColor(mod);
              return '<tr>'
                + '<td style="' + modThStyle + ';color:' + col + '">'
                +   '<span style="display:inline-block;width:3px;height:12px;border-radius:2px;background:' + col + ';vertical-align:middle;margin-right:6px"></span>'
                +   esc(mod)
                + '</td>'
                + scenes.map(sc => {
                    const count = matrix[mod][sc.name];
                    return '<td style="' + cellStyle(count) + '">' + (count || '·') + '</td>';
                  }).join('')
                + '<td style="padding:6px 10px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--border)">' + rowTotal + '</td>'
                + '</tr>';
            }).join('')
          + '<tr>'
          +   '<td style="' + modThStyle + ';color:var(--muted)">Total</td>'
          +   scenes.map(sc => {
                const col = scenes.reduce((s, _) => s, 0);
                const tot = activeModules.reduce((s, mod) => s + matrix[mod][sc.name], 0);
                return '<td style="padding:6px 10px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-top:2px solid var(--border)">' + tot + '</td>';
              }).join('')
          +   '<td style="padding:6px 10px;border:1px solid var(--border);border-top:2px solid var(--border)"></td>'
          + '</tr>'
          + '</tbody></table></div>';

      // ── mode : par script (cross-ref) ─────────────────────────────────────
      } else {
        const entries = Object.entries(scriptToScenes).sort((a,b) => b[1].length - a[1].length);
        // Group entries by module
        const byMod = {};
        entries.forEach(([base, scNames]) => {
          // find original path to get module
          let mod = '?';
          scenes.forEach(sc => sc.scripts.forEach(p => { if (p.split('/').pop().replace('.cs','') === base) mod = moduleOf(p); }));
          byMod[mod] = byMod[mod] || [];
          byMod[mod].push([base, scNames]);
        });

        body = Object.entries(byMod).sort((a,b)=>a[0].localeCompare(b[0])).map(([mod, items]) => {
          const col = modColor(mod);
          return '<div class="card" style="margin-bottom:12px">'
            + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
            +   '<span style="width:4px;height:18px;border-radius:2px;background:' + col + ';flex-shrink:0;display:inline-block"></span>'
            +   '<span style="font-weight:700;font-size:13px;color:' + col + '">' + esc(mod) + '</span>'
            +   '<span style="font-size:10px;color:var(--muted)">' + items.length + ' script' + (items.length>1?'s':'') + '</span>'
            + '</div>'
            + items.map(([base, scNames]) => {
                const cls = classMap[base];
                const sharedColor = scNames.length === 1 ? 'var(--muted)' : scNames.length <= 2 ? 'var(--yellow)' : 'var(--red)';
                return '<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
                  + '<span class="rtag ' + (cls ? kindCss(cls) : 'uses') + '" style="cursor:pointer;flex-shrink:0" onclick="go(\'class\',{n:\'' + base + '\'})">' + base + '</span>'
                  + '<span style="font-size:10px;font-weight:700;color:' + sharedColor + '">' + scNames.length + ' scène' + (scNames.length>1?'s':'') + '</span>'
                  + scNames.map(sceneBadge).join('')
                  + '</div>';
              }).join('')
            + '</div>';
        }).join('');
      }

      el.innerHTML = modeBar + stats + body;
      window._scenesMode = render;
    }
    window._scenesMode = render;
    render('scene');
  }).catch(() => {
    el.innerHTML = '<div style="color:var(--red);padding:24px 0;text-align:center">Erreur de chargement des scènes.</div>';
  });
}

// ── Fichiers requis ────────────────────────────────────────────────────────────
function _renderFilesInto(targetId) {
  const files   = D.requiredFiles || [];
  const missing = files.filter(f => f.refs.length && !f.exists);
  const ok      = files.filter(f => f.refs.length &&  f.exists);
  const orphan  = files.filter(f => !f.refs.length);

  const hintLabel = h => ({
    streaming: { lbl:'streamingAssetsPath', col:'var(--cyan)' },
    resources: { lbl:'Resources.Load',      col:'var(--purple)' },
    bare:      { lbl:'string littérale',    col:'var(--muted)' },
    orphan:    { lbl:'non référencé',       col:'var(--border)' },
  }[h] || { lbl: h, col:'var(--muted)' });

  const fileRow = (f, accent) => {
    const ext  = f.location.split('.').pop();
    const name = f.location.split('/').pop();
    const dir  = f.location.split('/').slice(0,-1).join('/');
    const owners = [...new Set(f.refs.map(r => r.owner))];
    const raws  = [...new Set(f.refs.map(r => r.raw))];
    const hints = [...new Set(f.refs.map(r => r.hint))];
    return `
    <div style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
        <span class="fext">.${ext}</span>
        <strong style="font-size:13px;color:${accent}">${name}</strong>
        <span style="font-size:10px;color:var(--muted);font-family:monospace">${dir}/</span>
        ${f.exists
          ? `<span style="font-size:10px;color:var(--green);margin-left:auto">✓ existe</span>`
          : `<span style="font-size:10px;color:var(--red);margin-left:auto;font-weight:600">✗ MANQUANT</span>`}
      </div>
      ${owners.length ? `
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px">
        <span style="font-size:10px;color:var(--muted)">Chargé par</span>
        ${owners.map(o => `<span class="rtag uses" style="cursor:pointer;font-size:10px" onclick="go('class',{n:'${o}'})">${o}</span>`).join('')}
      </div>` : ''}
      <details style="margin-top:3px">
        <summary style="font-size:10px;color:var(--border);cursor:pointer;user-select:none">
          Comment le chemin est écrit dans le code
        </summary>
        <div style="padding:6px 0 2px 4px;display:flex;flex-direction:column;gap:5px">
          ${f.refs.map(r => {
            const hl = hintLabel(r.hint);
            return `<div style="font-size:11px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
              <span style="font-family:monospace;color:var(--text)">"${esc(r.raw)}"</span>
              <span style="font-size:10px;padding:1px 6px;border-radius:8px;background:${hl.col}22;color:${hl.col}">${hl.lbl}</span>
              <span style="font-size:10px;color:var(--muted)">${r.owner} · ${r.file.split('/').pop()}</span>
            </div>`;
          }).join('')}
          ${!f.exists ? `
          <div style="font-size:11px;color:var(--red);margin-top:4px;padding-top:4px;border-top:1px solid var(--border)">
            → Ce fichier doit être placé à : <code style="font-size:11px">${f.location}</code>
          </div>` : ''}
        </div>
      </details>
    </div>`;
  };

  $(targetId).innerHTML = `
    <p style="color:var(--muted);font-size:12px;margin-bottom:16px">
      Ce que le code tente de charger — chemins détectés, où ils doivent être, et s'ils existent.
    </p>

    <div class="stats" style="margin-bottom:18px">
      <div class="stat"><div class="stat-n" style="color:var(--red)">${missing.length}</div><div class="stat-l">Manquants</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--green)">${ok.length}</div><div class="stat-l">OK</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--muted)">${orphan.length}</div><div class="stat-l">Orphelins</div></div>
    </div>

    ${missing.length ? `
    <div class="card" style="border-color:var(--red)50;margin-bottom:14px">
      <div class="card-t" style="color:var(--red)">✗ Fichiers manquants — le code les cherche mais ils n'existent pas (${missing.length})</div>
      ${missing.map(f => fileRow(f, 'var(--red)')).join('')}
    </div>` : ''}

    ${ok.length ? `
    <div class="card" style="margin-bottom:14px">
      <div class="card-t" style="color:var(--green)">✓ Fichiers référencés et présents (${ok.length})</div>
      ${ok.map(f => fileRow(f, 'var(--text)')).join('')}
    </div>` : ''}

    ${orphan.length ? `
    <details style="margin-bottom:14px">
      <summary style="font-size:12px;color:var(--muted);cursor:pointer;padding:10px 14px;
        background:var(--surface);border:1px solid var(--border);border-radius:8px">
        ${orphan.length} fichier${orphan.length>1?'s':''} dans StreamingAssets sans référence dans le code
        <span style="font-size:11px;margin-left:8px">(peuvent être chargés dynamiquement ou inutilisés)</span>
      </summary>
      <div class="card" style="border-top:none;border-radius:0 0 8px 8px;margin-top:0">
        ${orphan.map(f => {
          const ext  = f.location.split('.').pop();
          const name = f.location.split('/').pop();
          const dir  = f.location.split('/').slice(0,-1).join('/');
          return `<div class="fentry"><span class="fext">.${ext}</span><span>${name}</span><span class="fpath">${dir}</span></div>`;
        }).join('')}
      </div>
    </details>` : ''}`;
}

function renderAnalyse() {
  const ref       = new Set(D.referenced || []);
  const reach     = D.reachable ? new Set(D.reachable) : null;

  // dead100 : non atteignables depuis Unity (BFS si dispo, sinon token-scan)
  const dead100 = D.classes.filter(c => {
    if (_isUnityEntry(c)) return false;
    return reach ? !reach.has(c.name) : !ref.has(c.name);
  });
  // Îlots isolés : référencés par token-scan MAIS non atteignables par BFS
  // (A→B→A coupés du reste : détectés uniquement grâce au BFS)
  const deadIslands = reach
    ? dead100.filter(c => ref.has(c.name))
    : [];
  // deadUnity : entry-points Unity non référencés par d'autres classes C#
  // (utilise toujours le token-scan : le BFS les rend tous atteignables car ce sont les racines)
  const deadUnity = D.classes.filter(c => _isUnityEntry(c) && !ref.has(c.name));
  const cycles     = D.cycles || [];
  const todos      = D.todos  || [];
  const nInstable  = D.modules.filter(m => { const l = _coupling(m.health||{}).lbl; return l === 'Couplé' || l === 'Fondation dépendante'; }).length;

  const TAG_COL   = { TODO:'var(--accent)', FIXME:'var(--red)', HACK:'var(--yellow)', NOTE:'var(--cyan)', XXX:'var(--red)' };
  const TAG_ORDER = ['FIXME','XXX','TODO','HACK','NOTE'];
  const tagCounts = {};
  todos.forEach(t => tagCounts[t.tag] = (tagCounts[t.tag]||0) + 1);

  // Group by file, sort files so FIXME/XXX files appear first
  const byFile = {};
  todos.forEach(t => (byFile[t.file] = byFile[t.file]||[]).push(t));
  const fileEntries = Object.entries(byFile).sort(([fa,ia],[fb,ib]) => {
    const pri = items => Math.min(...items.map(t => ['FIXME','XXX'].includes(t.tag) ? 0 : ['TODO'].includes(t.tag) ? 1 : 2));
    return pri(ia) - pri(ib) || fa.localeCompare(fb);
  });

  $('main').innerHTML = `
    <h1 class="ph">Analyse
      <small>${dead100.length} dead${deadIslands.length ? ` (dont ${deadIslands.length} îlots)` : ''} · ${deadUnity.length} ⚠ Unity · ${nInstable} instable${nInstable!==1?'s':''} · ${todos.length} todos · ${cycles.length} cycle${cycles.length!==1?'s':''}</small>
    </h1>
    ${reach ? '' : '<div style="background:rgba(224,175,104,.1);border:1px solid var(--yellow);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--yellow);margin-bottom:12px">⚠ Données BFS non disponibles — actualise pour utiliser la détection par atteignabilité.</div>'}

    <div class="stats" style="margin-bottom:24px">
      <div class="stat">
        <div class="stat-n" style="color:var(--red)">${dead100.length}</div>
        <div class="stat-l">Dead code${reach ? ' (BFS)' : ''}</div>
      </div>
      ${deadIslands.length ? `<div class="stat">
        <div class="stat-n" style="color:var(--orange)">${deadIslands.length}</div>
        <div class="stat-l">Îlots isolés</div>
      </div>` : ''}
      <div class="stat">
        <div class="stat-n" style="color:var(--yellow)">${deadUnity.length}</div>
        <div class="stat-l">⚠ Unity</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:${nInstable?'var(--red)':'var(--green)'}">${nInstable}</div>
        <div class="stat-l">Modules instables</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:var(--accent)">${todos.length}</div>
        <div class="stat-l">TODOs</div>
      </div>
      <div class="stat">
        <div class="stat-n" style="color:${cycles.length?'var(--red)':'var(--green)'}">${cycles.length}</div>
        <div class="stat-l">Cycles dep.</div>
      </div>
    </div>

    <!-- TODOs / FIXMEs -->
    <section style="margin-bottom:28px">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ✎ TODOs / FIXMEs
        <span style="font-weight:400;color:var(--muted);font-size:12px">${todos.length} entrée${todos.length!==1?'s':''}</span>
        ${TAG_ORDER.filter(t=>tagCounts[t]).map(tag=>`
          <span style="font-size:10px;padding:2px 6px;border-radius:4px;
            background:${TAG_COL[tag]||'var(--muted)'}22;color:${TAG_COL[tag]||'var(--muted)'}"
          >${tag} ${tagCounts[tag]}</span>`).join('')}
      </h2>
      ${todos.length ? `
      <div style="display:flex;flex-direction:column;gap:10px">
        ${fileEntries.map(([file, items]) => `
          <div>
            <div style="font-size:11px;color:var(--muted);padding:3px 0;
              border-bottom:1px solid var(--border);margin-bottom:4px;font-family:monospace"
            >${file}</div>
            ${items.sort((a,b)=>a.line-b.line).map(t=>`
              <div style="display:flex;align-items:baseline;gap:7px;padding:3px 0;font-size:12px">
                <span style="flex-shrink:0;padding:1px 5px;border-radius:4px;font-size:10px;
                  background:${TAG_COL[t.tag]||'var(--muted)'}22;color:${TAG_COL[t.tag]||'var(--muted)'}"
                >${t.tag}</span>
                <span style="color:var(--border);font-size:10px;flex-shrink:0;font-family:monospace">${t.line}</span>
                <span style="color:var(--text)">${esc(t.text||'—')}</span>
              </div>`).join('')}
          </div>`).join('')}
      </div>` : `<p style="color:var(--muted);font-size:13px">Aucun TODO/FIXME/HACK dans les fichiers .cs ✓</p>`}
    </section>

    <!-- Cycles de dépendance -->
    <section style="margin-bottom:28px">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:10px;color:${cycles.length?'var(--red)':'var(--green)'}">
        ${cycles.length ? `⚠ ${cycles.length} cycle${cycles.length>1?'s':''} de dépendance détecté${cycles.length>1?'s':''}` : '✓ Aucun cycle de dépendance'}
      </h2>
      ${cycles.length ? `
      <div class="cycle-warn">
        ${cycles.map(c=>`<div class="cycle-path">${c.join(' → ')} → ${c[0]}</div>`).join('')}
      </div>` : `
      <p style="color:var(--muted);font-size:13px">Le graphe de dépendances inter-modules ne contient aucun cycle.</p>`}
    </section>

    <!-- Couplage des modules -->
    <section style="margin-bottom:28px">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:4px">⚡ Couplage des modules</h2>
      <p style="color:var(--muted);font-size:12px;margin-bottom:12px">
        Instabilité = Ce/(Ca+Ce). <strong style="color:var(--green)">0 = noyau stable</strong> (tout en dépend, risqué à modifier).
        <strong style="color:var(--red)">1 = instable</strong> (dépend de tout, rien n'en dépend). Cliquer sur un module pour le détailler.
      </p>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${D.modules.slice().sort((a,b) => (b.health?.instability||0) - (a.health?.instability||0)).map(mod => {
          const h = mod.health || {};
          const { lbl: il, col: ic, advice } = _coupling(h);
          return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;
            padding:9px 12px;cursor:pointer;transition:.12s" onclick="go('module',{n:'${mod.name}'})"
            onmouseover="this.style.borderColor='${ic}'" onmouseout="this.style.borderColor='var(--border)'">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">
              <div class="dot" style="background:${col(mod.name)};width:8px;height:8px;flex-shrink:0"></div>
              <strong style="font-size:13px;flex:1">${mod.name}</strong>
              <span style="font-size:11px;color:${ic};font-weight:600;min-width:52px;text-align:right">${il}${(h.ce>0&&h.ca>0)?` · ${h.instability.toFixed(2)}`:''}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden">
                <div style="width:${(h.ce===0&&h.ca===0)?50:h.instability*100}%;height:100%;background:${ic};border-radius:3px"></div>
              </div>
              <span style="font-size:10px;color:var(--muted);white-space:nowrap">
                → ${h.ce} sortant${h.ce>1?'es':''} · ← ${h.ca} entrant${h.ca>1?'es':''}
              </span>
            </div>
            ${advice ? `<div style="font-size:11px;color:${ic};margin-top:5px;padding-top:5px;border-top:1px solid var(--border)30">→ ${advice}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </section>

    <!-- Dead code -->
    <section style="margin-bottom:28px">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:4px;color:var(--red)">
        ◎ Dead code — ${dead100.length} classe${dead100.length!==1?'s':''}
        ${reach ? '<span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:6px">via BFS depuis Unity</span>' : ''}
      </h2>
      <p style="color:var(--muted);font-size:12px;margin-bottom:10px">
        ${reach
          ? 'Non atteignables par BFS depuis les entry-points Unity (MonoBehaviour / ScriptableObject). Candidats à la suppression.'
          : 'Aucune référence token trouvée dans le code source. Candidats à la suppression.'}
      </p>
      ${dead100.length ? `<ul class="cls-list" style="margin:0">${dead100.map(c=>analyseClsRow(c, ref.has(c.name)?'island':'dead')).join('')}</ul>`
        : `<p style="color:var(--muted);font-size:13px">Aucune. Bien joué !</p>`}
    </section>

    ${deadIslands.length ? `
    <!-- Îlots isolés -->
    <section style="margin-bottom:28px;padding:14px;background:rgba(255,158,100,.06);border:1px solid var(--orange);border-radius:8px">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:4px;color:var(--orange)">
        ⬡ Îlots isolés — ${deadIslands.length} classe${deadIslands.length!==1?'s':''}
      </h2>
      <p style="color:var(--muted);font-size:12px;margin-bottom:10px">
        Référencées par le scan token (apparaissent "vivantes") mais <strong>non atteignables depuis Unity par BFS</strong>.
        Ce sont des clusters circulaires coupés du reste (ex : A→B→A). Le scan classique les raterait.
      </p>
      <ul class="cls-list" style="margin:0">${deadIslands.map(c=>analyseClsRow(c,'island')).join('')}</ul>
    </section>` : ''}

    <!-- Unity warnings -->
    <section>
      <h2 style="font-size:14px;font-weight:600;margin-bottom:4px;color:var(--yellow)">
        ⚠ Entry-points Unity non référencés — ${deadUnity.length} classe${deadUnity.length!==1?'s':''}
      </h2>
      <p style="color:var(--muted);font-size:12px;margin-bottom:10px">
        Héritent de MonoBehaviour, ScriptableObject ou EditorWindow.
        Unity les instancie directement — l'absence de référence C# ne signifie pas forcément qu'elles sont inutilisées.
      </p>
      ${deadUnity.length ? `<ul class="cls-list" style="margin:0">${deadUnity.map(c=>analyseClsRow(c,'unity')).join('')}</ul>`
        : `<p style="color:var(--muted);font-size:13px">Aucune.</p>`}
    </section>

    <!-- Fichiers runtime -->
    ${(() => {
      const rf      = D.requiredFiles || [];
      const missing = rf.filter(f => f.refs && f.refs.length && !f.exists);
      const orphan  = rf.filter(f => f.refs && !f.refs.length);
      if (!missing.length && !orphan.length) return '';
      return `
    <section style="margin-top:28px;margin-bottom:28px">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:4px;color:${missing.length?'var(--red)':'var(--yellow)'}">
        ⚠ Fichiers runtime — ${missing.length} manquant${missing.length!==1?'s':''}, ${orphan.length} orphelin${orphan.length!==1?'s':''}
      </h2>
      <p style="color:var(--muted);font-size:12px;margin-bottom:10px">
        Fichiers chargés par le code mais absents de StreamingAssets — l'application plantera au runtime.
        <span style="cursor:pointer;color:var(--accent)" onclick="renderRessources('files')">→ Voir le détail dans Ressources</span>
      </p>
      ${missing.length ? `
      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px">
        ${missing.map(f => {
          const owners = f.refs.map(r => r.owner).filter((v,i,a)=>a.indexOf(v)===i);
          return '<div style="background:rgba(247,118,142,.08);border:1px solid var(--red)40;border-radius:6px;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
            + '<span style="font-size:11px;color:var(--red);font-weight:600">✗ ' + esc(f.location) + '</span>'
            + '<span style="font-size:10px;color:var(--muted)">chargé par ' + owners.map(o => '<span style="cursor:pointer;color:var(--text)" onclick="go(\'class\',{n:\'' + o + '\'})">' + o + '</span>').join(', ') + '</span>'
            + '</div>';
        }).join('')}
      </div>` : ''}
      ${orphan.length ? `<p style="font-size:11px;color:var(--muted)">${orphan.length} fichier${orphan.length!==1?'s':''} dans StreamingAssets sans aucune référence dans le code (peut-être chargés dynamiquement ou obsolètes).</p>` : ''}
    </section>`;
    })()}`;
}

function renderClasses() {
  const inbound = new Set(D.referenced || []);
  const deadCount = D.classes.filter(c => !inbound.has(c.name)).length;
  SHOW_DEAD_ONLY = false;
  $('main').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      <h1 class="ph" style="margin:0">Classes <small>${D.classes.length} types</small></h1>
      <button class="gbtn" id="dead-btn" onclick="toggleDeadCode()"
        title="Classes sans référence entrante">◎ Dead code (${deadCount})</button>
    </div>
    <input class="search" placeholder="Rechercher nom, module, type…"
           id="cls-search" oninput="filterCls(this.value)">
    <ul class="cls-list" id="cls-list">${clsItems(D.classes)}</ul>`;
}

function clsItems(list) {
  const inbound = new Set(D.referenced || []);
  return list.map(c => {
    const isDead = !inbound.has(c.name);
    const isUnity = isDead && (c.inherits||[]).some(p =>
      ['MonoBehaviour','ScriptableObject','EditorWindow'].includes(p));
    const deadBadge = isDead
      ? `<span title="${isUnity ? 'Unity entry-point — peut être normal' : 'Aucune référence entrante'}"
           style="font-size:10px;padding:1px 5px;border-radius:4px;margin-left:6px;
           background:${isUnity ? 'var(--yellow)' : 'var(--red)'}22;
           color:${isUnity ? 'var(--yellow)' : 'var(--red)'}">
           ${isUnity ? '⚠ Unity' : '◎ dead'}</span>`
      : '';
    return `
    <li class="cli" onclick="go('class',{n:'${c.name}'})">
      <span class="kbadge ${kindCss(c)}">${c.kind}</span>
      <span class="cli-name">${c.name}</span>
      ${deadBadge}
      ${c.module
        ? `<span class="mod-chip" style="background:${col(c.module)}22;color:${col(c.module)}">${c.module}</span>`
        : ''}
      ${c.description
        ? `<span style="color:var(--muted);font-size:11px;margin-left:6px">
            ${esc(c.description.split('\n')[0].substring(0,55))}…
          </span>`
        : ''}
    </li>`;
  }).join('');
}

function filterCls(q) {
  q = q.toLowerCase();
  const inbound = new Set(D.referenced || []);
  let filtered = D.classes.filter(c =>
    c.name.toLowerCase().includes(q) ||
    (c.module||'').toLowerCase().includes(q) ||
    c.kind.toLowerCase().includes(q));
  if (SHOW_DEAD_ONLY) filtered = filtered.filter(c => !inbound.has(c.name));
  $('cls-list').innerHTML = clsItems(filtered);
}

// ── Graphe ────────────────────────────────────────────────────────────────────
function renderGraph() {
  GRAPH_MODE = 'deps';
  $('scenario-info').style.display   = 'none';
  $('scenario-detail').style.display = 'none';
  $('graph-ctrl').style.display      = '';
  $('graph-legend').style.display    = '';
  showMain(false);
  if (NET) { NET.destroy(); NET = null; }
  requestAnimationFrame(() => buildGraph(LEVEL));
}

function filterGraph(modName) {
  FILTER_MOD = FILTER_MOD === modName ? null : modName;
  document.querySelectorAll('.sb-graph-btn').forEach(b => b.classList.remove('on'));
  if (FILTER_MOD) {
    const btn = $(`sgb-${FILTER_MOD}`);
    if (btn) btn.classList.add('on');
    $('graph-filter-bar').style.display = '';
    $('graph-filter-label').textContent = `Filtre : ${FILTER_MOD}`;
  } else {
    $('graph-filter-bar').style.display = 'none';
  }
  LEVEL = 'class';
  FROZEN = false;
  $('gbn-mod').classList.remove('on');
  $('gbn-cls').classList.add('on');
  $('gbn-freeze').classList.remove('on');
  setNav('graph');
  showMain(false);
  if (NET) { NET.destroy(); NET = null; }
  requestAnimationFrame(() => buildGraph('class'));
}

function clearGraphFilter() {
  FILTER_MOD = null;
  $('graph-filter-bar').style.display = 'none';
  document.querySelectorAll('.sb-graph-btn').forEach(b => b.classList.remove('on'));
  if (NET) { NET.destroy(); NET = null; }
  buildGraph(LEVEL);
}

function toggleUses() {
  if (GRAPH_MODE !== 'deps') return;
  SHOW_USES = !SHOW_USES;
  $('gbn-uses').classList.toggle('on', SHOW_USES);
  if (NET) { NET.destroy(); NET = null; }
  buildGraph(LEVEL);
}

function toggleFreeze() {
  FROZEN = !FROZEN;
  $('gbn-freeze').classList.toggle('on', FROZEN);
  if (NET) NET.setOptions({ physics: { enabled: !FROZEN } });
}

function switchLevel(lvl) {
  if (GRAPH_MODE !== 'deps') return;
  LEVEL = lvl;
  FROZEN = false;
  if (lvl !== 'module') { LAYERED = false; }
  $('gbn-mod').classList.toggle('on', lvl === 'module');
  $('gbn-cls').classList.toggle('on', lvl === 'class');
  $('gbn-layers').classList.toggle('on', LAYERED);
  $('gbn-freeze').classList.remove('on');
  if (NET) { NET.destroy(); NET = null; }
  buildGraph(lvl);
}

function toggleLayers() {
  if (LEVEL !== 'module' || GRAPH_MODE !== 'deps') return;
  LAYERED = !LAYERED;
  FROZEN  = false;
  $('gbn-layers').classList.toggle('on', LAYERED);
  $('gbn-freeze').classList.remove('on');
  if (NET) { NET.destroy(); NET = null; }
  buildGraph('module');
}

function buildGraph(lvl) {
  const container = $('graph-canvas');
  if (!container) return;

  let nodes, edges;

  if (lvl === 'module') {
    nodes = new vis.DataSet(D.modules.map(m => {
      const h = m.health || {};
      const instTxt = h.instability !== undefined
        ? `\nInstabilité: ${h.instability.toFixed(2)} (Ce=${h.ce} Ca=${h.ca})\nCouche: ${h.visLevel ?? '?'}` : '';
      const nd = {
        id:    m.name,
        label: m.name,
        color: { background: col(m.name), border: col(m.name),
                 highlight: { background: '#fff', border: col(m.name) } },
        font:  { color: '#c0caf5', size: 13, bold: true },
        size:  18 + m.classes.length * 1.5,
        shape: 'dot',
        title: `${m.name}\n${m.classes.length} classes — ${m.files.length} fichiers${instTxt}`,
      };
      if (LAYERED && h.visLevel !== undefined) nd.level = h.visLevel;
      return nd;
    }));

    edges = new vis.DataSet((D.moduleEdges||[]).map((e, i) => ({
      id:     i,
      from:   e.from,
      to:     e.to,
      width:  Math.min(1 + e.count * 0.4, 5),
      color:  { color: '#414868', highlight: '#7aa2f7', opacity: 0.85 },
      title:  `${e.count} dépendance(s)\n${e.details.slice(0,5).map(d=>`${d.from} → ${d.to}`).join('\n')}`,
      arrows: { to: { enabled: true, scaleFactor: 0.55 } },
      smooth: LAYERED ? { type: 'cubicBezier', forceDirection: 'vertical' } : { type: 'curvedCW', roundness: 0.2 },
    })));

  } else {
    // Filtre par module si actif
    let visibleClasses = D.classes;
    if (FILTER_MOD) {
      const modSet = new Set(D.classes.filter(c => c.module === FILTER_MOD).map(c => c.name));
      const expanded = new Set(modSet);
      D.dependencies.forEach(d => {
        if (modSet.has(d.from)) expanded.add(d.to);
        if (modSet.has(d.to))   expanded.add(d.from);
      });
      visibleClasses = D.classes.filter(c => expanded.has(c.name));
    }
    const visibleNames = new Set(visibleClasses.map(c => c.name));

    nodes = new vis.DataSet(visibleClasses.map(c => ({
      id:    c.name,
      label: c.name,
      color: { background: col(c.module||'')+'99', border: col(c.module||''),
               highlight: { background: '#fff', border: col(c.module||'') } },
      font:  { color: '#c0caf5', size: 11 },
      shape: c.kind === 'interface' ? 'diamond'
           : c.kind === 'enum'      ? 'triangle'
           : c.kind === 'struct'    ? 'square' : 'dot',
      size:  11,
      title: `[${c.kind}] ${c.name}  (${c.module||'?'})\n${c.description?.split('\n')[0]||''}`,
    })));

    const visibleDeps = D.dependencies.filter(d =>
      (SHOW_USES || d.type !== 'uses') &&
      (!FILTER_MOD || (visibleNames.has(d.from) && visibleNames.has(d.to)))
    );
    edges = new vis.DataSet(visibleDeps.map((d, i) => ({
      id:     i,
      from:   d.from, to: d.to,
      color:  {
        color: d.type === 'implements' ? '#bb9af7'
             : d.type === 'uses'       ? '#e0af68'
             :                          '#7dcfff',
        opacity: 0.55,
      },
      dashes: d.type === 'implements' ? true
            : d.type === 'uses'       ? [4, 4]
            : false,
      arrows: { to: { enabled: true, scaleFactor: 0.45 } },
      title:  d.type,
      smooth: { type: 'continuous' },
      width:  d.type === 'uses' ? 1 : 1.5,
    })));
  }

  const netOpts = {
    layout: (lvl === 'module' && LAYERED) ? {
      hierarchical: {
        enabled: true,
        direction: 'UD',
        sortMethod: 'directed',
        levelSeparation: 120,
        nodeSpacing: 140,
        treeSpacing: 160,
      }
    } : {},
    physics: (lvl === 'module' && LAYERED) ? { enabled: false } : {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: {
        gravitationalConstant: lvl === 'module' ? -80 : -50,
        centralGravity: 0.006,
        springLength:   lvl === 'module' ? 180 : 120,
        springConstant: 0.08,
        damping: 0.4,
      },
      stabilization: { iterations: 250 },
    },
    interaction: {
      hover: true, tooltipDelay: 180,
      navigationButtons: false, keyboard: true, zoomView: true,
    },
  };

  NET = new vis.Network(container, { nodes, edges }, netOpts);

  if (lvl === 'module' && LAYERED) {
    requestAnimationFrame(() => {
      NET.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
      FROZEN = true;
      $('gbn-freeze').classList.add('on');
    });
  } else {
    NET.once('stabilizationIterationsDone', () => {
      NET.setOptions({ physics: { enabled: false } });
      NET.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
      FROZEN = true;
      $('gbn-freeze').classList.add('on');
    });
  }

  NET.on('click', p => {
    if (!p.nodes.length) return;
    const id = p.nodes[0];
    if (lvl === 'module') { showMain(true); go('module', { n: id }); }
    else                  { showMain(true); go('class',  { n: id }); }
  });
}

// ── Fichier ───────────────────────────────────────────────────────────────────
async function renderFile(path, mod) {
  _curFilePath = path;
  _curFileMod  = mod;
  $('main').innerHTML = '<div id="loading">Chargement du fichier…</div>';
  try {
    const r = await fetch('/api/file?path=' + encodeURIComponent(path));
    const d = await r.json();
    if (d.error) { $('main').innerHTML = `<p style="color:var(--red)">${d.error}</p>`; return; }

    const fname = path.split('/').pop();
    const ext   = fname.split('.').pop().toLowerCase();
    const crumb = path.split('/').map((seg, i, a) =>
      i === a.length - 1
        ? `<span style="color:var(--text)">${seg}</span>`
        : `<span>${seg}</span> <span style="color:var(--border)">/</span>`
    ).join(' ');

    let body;
    if (ext === 'md') {
      body = `
        <div style="display:flex;gap:6px;margin-bottom:14px">
          <button class="gbtn on" id="fv-preview-btn" onclick="toggleFileView('preview')">Aperçu</button>
          <button class="gbtn"    id="fv-edit-btn"    onclick="toggleFileView('edit')">Éditer</button>
        </div>
        <div id="fv-body" class="md-body">${parseMd(d.content)}</div>
        <textarea id="fv-textarea" spellcheck="false"
          style="display:none;width:100%;min-height:420px;background:var(--surface);
          border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);
          font-size:12px;font-family:monospace;resize:vertical;outline:none;line-height:1.6"
        >${esc(d.content)}</textarea>
        <div id="fv-save-row" style="display:none;margin-top:10px">
          <button class="gbtn on" onclick="saveFileContent()">Sauvegarder</button>
          <button class="gbtn" onclick="toggleFileView('preview')" style="margin-left:6px">Annuler</button>
        </div>`;
    } else if (ext === 'csv') {
      body = renderCsvContent(d.content);
    } else {
      body = `<pre class="code">${esc(d.content)}</pre>`;
    }

    $('main').innerHTML = `
      <button class="back" onclick="go('module',{n:'${mod||''}'})">← ${mod||'Retour'}</button>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px">${crumb}</div>
      ${body}`;

    if (OPEN_IN_EDIT && ext === 'md') {
      OPEN_IN_EDIT = false;
      toggleFileView('edit');
    }
  } catch(e) {
    $('main').innerHTML = `<p style="color:var(--red)">Erreur : ${e.message}</p>`;
  }
}

function toggleFileView(mode) {
  const preview = $('fv-body');
  const editor  = $('fv-textarea');
  const saveRow = $('fv-save-row');
  const prevBtn = $('fv-preview-btn');
  const editBtn = $('fv-edit-btn');
  if (!preview) return;
  if (mode === 'edit') {
    preview.style.display  = 'none';
    editor.style.display   = 'block';
    saveRow.style.display  = 'flex';
    prevBtn.classList.remove('on');
    editBtn.classList.add('on');
    editor.focus();
  } else {
    preview.innerHTML      = parseMd(editor.value);
    preview.style.display  = 'block';
    editor.style.display   = 'none';
    saveRow.style.display  = 'none';
    prevBtn.classList.add('on');
    editBtn.classList.remove('on');
  }
}

async function saveFileContent() {
  const content = $('fv-textarea').value;
  try {
    const r = await fetch('/api/file-write', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: _curFilePath, content})
    });
    const d = await r.json();
    if (d.error) { alert('Erreur : ' + d.error); return; }
    $('fv-body').innerHTML = parseMd(content);
    toggleFileView('preview');
  } catch(e) { alert('Erreur : ' + e.message); }
}
