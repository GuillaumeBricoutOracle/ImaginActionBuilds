// ── ESP Monitor ───────────────────────────────────────────────────────────────
function _espEffectiveStatus(esp) {
  if (!esp.updatedAt) return 'unknown';
  if (esp.status === 'offline') return 'offline';
  var age = Date.now() / 1000 - esp.updatedAt;
  if (age > 15 && esp.status === 'online') return 'stale';
  if (age > 5  && esp.status === 'online') return 'warn';
  return esp.status || 'unknown';
}
function _espStatusColor(st) {
  if (st === 'online')  return '#9ece6a';
  if (st === 'warn')    return '#e0af68';
  if (st === 'stale')   return '#f7768e';
  if (st === 'offline') return '#f7768e';
  return '#414868';
}
function _espStatusLabel(st) {
  if (st === 'warn')  return 'online (lent)';
  if (st === 'stale') return 'silencieux';
  if (st === 'unknown') return 'inactif';
  return st;
}
function _timeAgo(ts) {
  if (!ts) return '—';
  var s = Math.floor(Date.now() / 1000 - ts);
  if (s < 5)    return 'à l\'instant';
  if (s < 60)   return 'il y a ' + s + 's';
  if (s < 3600) return 'il y a ' + Math.floor(s/60) + 'min';
  return 'il y a ' + Math.floor(s/3600) + 'h';
}
function _sparkline(values, w, h, color) {
  if (!values || values.length < 2) return '';
  var mx = Math.max.apply(null, values.concat(1));
  var mn = Math.min.apply(null, values);
  var rng = mx - mn || 1;
  var bw = w / values.length;
  var bars = '';
  values.forEach(function(v, i) {
    var bh = Math.max(1, Math.round(((v - mn) / rng) * h));
    bars += '<rect x="' + Math.round(i * bw) + '" y="' + (h - bh) + '" '
      + 'width="' + Math.max(1, Math.floor(bw) - 1) + '" height="' + bh + '" fill="' + color + '" opacity=".75"/>';
  });
  return '<svg width="' + w + '" height="' + h + '" style="display:block">' + bars + '</svg>';
}
function _trackEspSpark(esp) {
  if (!esp.lastReceived || !esp.updatedAt) return;
  var obj; try { obj = JSON.parse(esp.lastReceived); } catch(e) { return; }
  var data = (obj && obj.variables) ? obj.variables : obj;
  if (typeof data !== 'object' || !data) return;
  if (!_espSparkData[esp.id]) _espSparkData[esp.id] = {};
  Object.keys(data).forEach(function(k) {
    var v = parseFloat(data[k]);
    if (isNaN(v)) return;
    if (!_espSparkData[esp.id][k]) _espSparkData[esp.id][k] = [];
    _espSparkData[esp.id][k].push(v);
    if (_espSparkData[esp.id][k].length > 30) _espSparkData[esp.id][k].shift();
  });
}

function _espKvTable(obj, maxRows) {
  var entries = Object.entries(obj);
  if (!entries.length) return '<span style="opacity:.3;font-size:11px">vide</span>';
  var shown = entries.slice(0, maxRows), rest = entries.length - maxRows;
  var h = '<table style="font-size:11px;width:100%;border-collapse:collapse">';
  shown.forEach(function(kv) {
    h += '<tr>'
      + '<td style="color:var(--muted);padding:1px 8px 1px 0;white-space:nowrap;vertical-align:top">' + esc(String(kv[0])) + '</td>'
      + '<td style="font-family:monospace;word-break:break-all">' + esc(String(kv[1])) + '</td>'
      + '</tr>';
  });
  if (rest > 0) h += '<tr><td colspan="2" style="color:var(--muted);font-size:10px">+' + rest + ' champs…</td></tr>';
  return h + '</table>';
}

function _renderEspRecv(json) {
  if (!json) return '<span style="opacity:.3;font-size:11px">—</span>';
  var obj;
  try { obj = JSON.parse(json); } catch(e) {
    return '<span style="font-family:monospace;font-size:10px;word-break:break-all">' + esc(json.slice(0,120)) + '</span>';
  }
  var data = (obj && obj.variables) ? obj.variables : obj;
  if (typeof data !== 'object' || data === null) return '<span style="font-family:monospace;font-size:11px">' + esc(json.slice(0,120)) + '</span>';
  return _espKvTable(data, 12);
}

function _renderEspSent(json) {
  if (!json) return '<span style="opacity:.3;font-size:11px">—</span>';
  var obj;
  try { obj = JSON.parse(json); } catch(e) {
    return '<span style="font-family:monospace;font-size:10px;word-break:break-all">' + esc(json.slice(0,120)) + '</span>';
  }
  var action = (obj && obj.action) ? obj.action : '';
  var opts   = (obj && obj.options && typeof obj.options === 'object') ? obj.options : {};
  var h = '';
  if (action) h += '<div style="font-weight:700;font-size:12px;color:var(--accent);margin-bottom:5px">' + esc(action) + '</div>';
  var optEntries = Object.entries(opts).filter(function(kv){ return kv[0] !== 'hardware'; });
  if (optEntries.length) h += _espKvTable(Object.fromEntries(optEntries), 12);
  return h || '<span style="opacity:.3;font-size:11px">—</span>';
}

function _detailRow(label, items) {
  if (!items || !items.length) return '';
  var rows = items.slice().reverse().map(function(it) {
    var t = it.ts ? new Date(it.ts * 1000).toLocaleTimeString() : '';
    return '<tr>'
      + '<td style="color:var(--muted);font-size:10px;white-space:nowrap;padding-right:8px">' + t + '</td>'
      + '<td style="font-size:11px;font-family:monospace;word-break:break-all">' + esc(it.msg) + '</td>'
      + '</tr>';
  }).join('');
  return '<div style="margin-top:10px">'
    + '<div style="font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--muted);margin-bottom:4px">' + label + '</div>'
    + '<table style="width:100%;border-collapse:collapse">' + rows + '</table>'
    + '</div>';
}

function _renderEspDetailHeader(esp, key) {
  var st  = _espEffectiveStatus(esp);
  var col = _espStatusColor(st);
  var cat = esp.catalog || {};
  var type     = cat.type || (esp.meta || {}).type || '';
  var maison   = cat.maison || '';
  var ilot     = cat.ilot || '';
  var location = [maison, ilot].filter(Boolean).join(' › ');
  var ip  = cat.ip || (esp.meta || {}).ip || '';
  var mac = cat.mac || '';
  var h = '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px">';
  h += '<div style="width:9px;height:9px;border-radius:50%;background:' + col + ';flex-shrink:0"></div>';
  h += '<strong style="font-size:13px">' + esc(esp.id) + '</strong>';
  h += '<span style="font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(0,0,0,.3);color:' + col + '">' + esc(_espStatusLabel(st)) + '</span>';
  if (type)     h += '<span style="font-size:10px;padding:1px 7px;border-radius:8px;background:var(--surface2);color:var(--muted)">' + esc(type) + '</span>';
  if (location) h += '<span style="font-size:11px;color:var(--cyan)">' + esc(location) + '</span>';
  if (ip || mac) h += '<code style="font-size:10px;color:var(--muted)">' + (ip ? esc(ip) : '') + (mac ? ' · ' + esc(mac) : '') + '</code>';
  h += '<button onclick="_selectEspDetail(null)" style="margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px" title="Fermer">&#10005;</button>';
  return h + '</div>';
}

function _renderEspDetailHistory(esp) {
  var h = '<div style="padding:12px 14px">';
  var sparkEntry = _espSparkData[esp.id];
  if (sparkEntry) {
    var sparkKeys = Object.keys(sparkEntry);
    if (sparkKeys.length) {
      h += '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px">';
      sparkKeys.forEach(function(k) {
        var vals = sparkEntry[k];
        h += '<div>'
          + '<div style="font-size:9px;color:var(--muted);margin-bottom:2px">' + esc(k) + '</div>'
          + _sparkline(vals, 80, 24, '#7aa2f7')
          + '</div>';
      });
      h += '</div>';
    }
  }
  h += _detailRow('↓ HISTORIQUE REÇU', esp.historyReceived);
  h += _detailRow('↑ HISTORIQUE ENVOYÉ', esp.historySent);
  return h + '</div>';
}

function _espDetailHtml(esp, key) {
  return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:16px">'
    + '<div id="esp-dh-' + key + '" style="border-bottom:1px solid var(--border)">'
    +   _renderEspDetailHeader(esp, key)
    + '</div>'
    + '<div style="display:flex;flex-wrap:wrap">'
    +   '<div id="esp-di-' + key + '" style="flex:1;min-width:220px;border-right:1px solid var(--border)">'
    +   _renderEspDetailHistory(esp) + '</div>'
    +   '<div id="esp-dc-' + key + '" style="flex:1.2;min-width:260px">'
    +   _renderEspConsole(esp) + '</div>'
    + '</div>'
    + '</div>';
}

function _espCard(esp) {
  var st    = _espEffectiveStatus(esp);
  var color = _espStatusColor(st);
  var ago   = _timeAgo(esp.updatedAt);
  var cat   = esp.catalog || {};
  var meta  = esp.meta || {};
  var isInactive = (st === 'unknown');
  var opacity = isInactive ? 'opacity:.45;' : '';

  var ip       = cat.ip || meta.ip || '';
  var mac      = cat.mac || '';
  var type     = cat.type || meta.type || '';
  var maison   = cat.maison || '';
  var ilot     = cat.ilot || '';
  var location = [maison, ilot].filter(Boolean).join(' › ');

  var specParts = [];
  if (cat.nbLeds > 0)   specParts.push(cat.nbLeds + ' LEDs' + (cat.nbLedsUsed > 0 && cat.nbLedsUsed !== cat.nbLeds ? ' (' + cat.nbLedsUsed + ' utilisées)' : ''));
  if (cat.nbServos > 0) specParts.push(cat.nbServos + ' servo' + (cat.nbServos > 1 ? 's' : ''));
  var specLine = specParts.join('  ·  ');

  var servoList = (cat.servoNames && cat.servoNames.length)
    ? cat.servoNames.map(function(n) { return '<span style="font-size:10px;background:var(--surface2);padding:1px 6px;border-radius:3px;color:var(--muted)">' + esc(n) + '</span>'; }).join('')
    : '';

  // Sparklines for this card (first numeric variable found)
  var sparkHtml = '';
  var sparkEntry = _espSparkData[esp.id];
  if (sparkEntry) {
    var firstKey = Object.keys(sparkEntry)[0];
    if (firstKey) {
      sparkHtml = '<div style="margin-bottom:6px">'
        + '<span style="font-size:9px;color:var(--muted)">' + esc(firstKey) + ' </span>'
        + _sparkline(sparkEntry[firstKey], 60, 18, '#7aa2f7')
        + '</div>';
    }
  }

  var isSelected = (_espDetailId === esp.id);
  var border = isSelected ? '3px solid var(--accent)' : '3px solid ' + color;

  return '<div class="card" onclick="_selectEspDetail(\'' + esc(esp.id) + '\')" style="' + opacity + 'border-left:' + border + ';margin-bottom:0;padding:12px 14px;cursor:pointer">'

    + '<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">'
    +   '<div style="width:9px;height:9px;border-radius:50%;background:' + color + ';flex-shrink:0"></div>'
    +   '<span style="font-weight:700;font-size:13px">' + esc(esp.id) + '</span>'
    +   '<span style="font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(0,0,0,.3);color:' + color + '">' + esc(_espStatusLabel(st)) + '</span>'
    +   (type ? '<span style="font-size:10px;padding:1px 7px;border-radius:8px;background:var(--surface2);color:var(--muted)">' + esc(type) + '</span>' : '')
    +   '<span style="margin-left:auto;font-size:11px;color:var(--muted)">' + ago + '</span>'
    + '</div>'

    + (location ? '<div style="font-size:11px;color:var(--cyan);margin-bottom:3px">' + esc(location) + '</div>' : '')

    + '<div style="font-size:11px;color:var(--muted);font-family:monospace;margin-bottom:5px">'
    +   (ip  ? '<span>' + esc(ip) + '</span>' : '')
    +   (mac ? '<span style="opacity:.55"> · ' + esc(mac) + '</span>' : '')
    + '</div>'

    + (specLine ? '<div style="font-size:11px;margin-bottom:4px">' + esc(specLine) + '</div>' : '')
    + (servoList ? '<div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px">' + servoList + '</div>' : '')
    + sparkHtml

    + '<div style="border-top:1px solid var(--border);margin:8px 0"></div>'

    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
    +   '<div>'
    +     '<div style="font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--muted);margin-bottom:5px">↓ REÇU DE L\'ESP</div>'
    +     _renderEspRecv(esp.lastReceived)
    +   '</div>'
    +   '<div>'
    +     '<div style="font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--muted);margin-bottom:5px">↑ ENVOYÉ À L\'ESP</div>'
    +     _renderEspSent(esp.lastSent)
    +   '</div>'
    + '</div>'

    + '</div>';
}

function renderEsp() {
  showMain(true);
  if (_espPollTimer) { clearInterval(_espPollTimer); _espPollTimer = null; }
  _espDetailId = null;

  var filterBar = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center">'
    + '<select id="esp-f-maison" onchange="_applyEspFilter()" style="background:var(--surface2);border:1px solid var(--border);color:var(--fg);padding:4px 8px;border-radius:6px;font-size:12px">'
    + '<option value="">Toutes les maisons</option></select>'
    + '<select id="esp-f-type" onchange="_applyEspFilter()" style="background:var(--surface2);border:1px solid var(--border);color:var(--fg);padding:4px 8px;border-radius:6px;font-size:12px">'
    + '<option value="">Tous les types</option></select>'
    + '<select id="esp-f-status" onchange="_applyEspFilter()" style="background:var(--surface2);border:1px solid var(--border);color:var(--fg);padding:4px 8px;border-radius:6px;font-size:12px">'
    + '<option value="">Tous les statuts</option>'
    + '<option value="online">En ligne</option>'
    + '<option value="warn">Lent</option>'
    + '<option value="stale">Silencieux</option>'
    + '<option value="offline">Hors ligne</option>'
    + '<option value="unknown">Inactif</option>'
    + '</select>'
    + '<span id="esp-status" style="font-size:12px;color:var(--muted);margin-left:auto">Connexion…</span>'
    + '<button onclick="_espClear()" style="background:none;border:1px solid var(--border);color:var(--muted);padding:3px 10px;border-radius:6px;font-size:12px;cursor:pointer">&#10005; Effacer</button>'
    + '</div>';

  $('main').innerHTML = '<h1 class="ph">ESP Monitor</h1>'
    + filterBar
    + '<div id="esp-detail-panel" style="display:none"></div>'
    + '<div id="esp-grid"></div>'
    + '<details style="margin-top:28px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px">'
    + '<summary style="cursor:pointer;font-size:12px;color:var(--muted);font-weight:600">Intégration Unity — comment envoyer les données</summary>'
    + '<div style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.8">'
    + '<p>POST vers <code>http://127.0.0.1:5757/api/esp</code> avec <code>espId</code>, <code>status</code>, <code>lastReceived</code>, <code>lastSent</code>, <code>scenario</code>, <code>meta</code>.</p>'
    + '<p>Pour effacer : POST vers <code>/api/esp/clear</code>.</p>'
    + '</div>'
    + '</details>';

  function _refresh() {
    fetch('/api/esp').then(function(r) { return r.json(); }).then(function(esps) {
      var grid   = $('esp-grid');
      var status = $('esp-status');
      var detail = $('esp-detail-panel');
      if (!grid) return;
      esps.forEach(function(e) { _espLatestData[e.id] = e; });

      // Track sparklines
      esps.forEach(_trackEspSpark);

      // Populate filter dropdowns (only first time each has 1 option)
      var fMaison = $('esp-f-maison');
      var fType   = $('esp-f-type');
      if (fMaison && fMaison.options.length === 1) {
        var maisons = [];
        esps.forEach(function(e) { var m = (e.catalog || {}).maison; if (m && maisons.indexOf(m) < 0) maisons.push(m); });
        maisons.sort().forEach(function(m) { var o = document.createElement('option'); o.value = m; o.textContent = m; fMaison.appendChild(o); });
      }
      if (fType && fType.options.length === 1) {
        var types = [];
        esps.forEach(function(e) { var t = (e.catalog || {}).type || (e.meta || {}).type; if (t && types.indexOf(t) < 0) types.push(t); });
        types.sort().forEach(function(t) { var o = document.createElement('option'); o.value = t; o.textContent = t; fType.appendChild(o); });
      }

      // Apply filters
      var filtered = esps.filter(function(e) {
        var cat = e.catalog || {};
        var meta = e.meta || {};
        if (_espFilterMaison && cat.maison !== _espFilterMaison) return false;
        if (_espFilterType   && (cat.type || meta.type) !== _espFilterType) return false;
        if (_espFilterStatus && _espEffectiveStatus(e) !== _espFilterStatus) return false;
        return true;
      });

      var online  = esps.filter(function(e) { return _espEffectiveStatus(e) === 'online'; }).length;
      var warn    = esps.filter(function(e) { return _espEffectiveStatus(e) === 'warn'; }).length;
      var offline = esps.filter(function(e) { return _espEffectiveStatus(e) === 'offline'; }).length;

      if (status) status.textContent = esps.length + ' ESP  —  '
        + online + ' en ligne'
        + (warn ? '  ·  ' + warn + ' lents' : '')
        + '  ·  ' + offline + ' hors ligne';

      if (!filtered.length) {
        grid.innerHTML = '<div style="color:var(--muted);padding:48px 0;text-align:center;font-size:13px">Aucun ESP correspond aux filtres.</div>';
      } else {
        grid.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px">'
          + filtered.map(_espCard).join('')
          + '</div>';
      }

      // Detail panel
      if (detail) {
        if (_espDetailId) {
          var found = esps.filter(function(e) { return e.id === _espDetailId; })[0];
          if (!found) {
            detail.style.display = 'none';
          } else {
            detail.style.display = '';
            var dkey = _espWsKey(_espDetailId);
            var consoleDiv = document.getElementById('esp-dc-' + dkey);
            if (!consoleDiv) {
              detail.innerHTML = _espDetailHtml(found, dkey);
              _espConnectWs(found);
              _espLoadTemplates(found);
            } else {
              var hdrDiv  = document.getElementById('esp-dh-' + dkey);
              var infoDiv = document.getElementById('esp-di-' + dkey);
              if (hdrDiv)  hdrDiv.innerHTML  = _renderEspDetailHeader(found, dkey);
              if (infoDiv) infoDiv.innerHTML = _renderEspDetailHistory(found);
            }
          }
        } else {
          detail.style.display = 'none';
        }
      }
    }).catch(function() {
      var s = $('esp-status');
      if (s) s.textContent = 'Erreur de connexion au serveur';
    });
  }

  _refresh();

  // SSE for instant updates; fallback poll every 15s in case SSE drops
  if (_espEventSource) { _espEventSource.close(); _espEventSource = null; }
  _espEventSource = new EventSource('/api/events');
  _espEventSource.addEventListener('esp-update', _refresh);
  _espEventSource.addEventListener('clear', function() {
    _espSparkData = {};
    _espDetailId  = null;
    _refresh();
  });
  _espPollTimer = setInterval(_refresh, 15000);
}

function _espClear() {
  fetch('/api/esp/clear', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' })
    .then(function() {
      _espDetailId = null;
      _espSparkData = {};
      var g = $('esp-grid');
      if (g) g.innerHTML = '<div style="color:var(--muted);padding:48px 0;text-align:center;font-size:13px">'
        + 'Registre effacé. En attente de nouvelles données…</div>';
      var s = $('esp-status');
      if (s) s.textContent = '0 ESP';
      var d = $('esp-detail-panel');
      if (d) { d.style.display = 'none'; d.innerHTML = ''; }
    });
}

// ── ESP Console / WebSocket direct ────────────────────────────────────────────

function _espWsKey(id) {
  return (id || '').replace(/[^a-zA-Z0-9]/g, '_');
}

// ESP_ACTIONS removed — now uses textarea JSON editor (universal, works for any ESP type)

function _espConnectWs(esp) {
  var key = _espWsKey(esp.id);
  var ip  = (esp.catalog || {}).ip || (esp.meta || {}).ip;
  if (!ip || _espWsPool[key]) return;
  function dot() { return document.getElementById('esp-ws-dot-' + key); }
  var ws = new WebSocket('ws://' + ip + '/ws');
  _espWsPool[key] = ws;
  ws.onopen    = function() { var d=dot(); if(d){d.style.background='#9ece6a';d.title='Connecté';} };
  ws.onclose   = function() { delete _espWsPool[key]; var d=dot(); if(d){d.style.background='#f7768e';d.title='Déconnecté';} };
  ws.onerror   = function() { var d=dot(); if(d){d.style.background='#f7768e';d.title='Erreur WebSocket';} };
  ws.onmessage = function(e) {
    if (!_espCmdLog[key]) _espCmdLog[key] = [];
    _espCmdLog[key].push({dir:'recv', msg: e.data, ts: Date.now()/1000});
    if (_espCmdLog[key].length > 30) _espCmdLog[key].shift();
    _espConsolePushLog(key);
  };
}

function _espDisconnectWs(espId) {
  var key = _espWsKey(espId);
  var ws  = _espWsPool[key];
  if (ws) { try { ws.close(); } catch(e2) {} delete _espWsPool[key]; }
}

function _espConsolePushLog(key) {
  var el = document.getElementById('esp-ws-log-' + key);
  if (!el || !_espCmdLog[key]) return;
  el.innerHTML = _espCmdLog[key].slice(-12).reverse().map(function(entry) {
    var col = entry.dir === 'sent' ? 'var(--cyan)' : 'var(--green)';
    var t   = new Date(entry.ts * 1000).toLocaleTimeString();
    return '<div style="padding:1px 0;border-bottom:1px solid rgba(255,255,255,.04)">'
      + '<span style="color:var(--muted);margin-right:6px">' + t + '</span>'
      + '<span style="color:' + col + '">' + (entry.dir==='sent'?'↑ ':'↓ ') + '</span>'
      + '<span style="word-break:break-all">' + esc(entry.msg.slice(0,160)) + '</span>'
      + '</div>';
  }).join('');
}

function _espSendCmd(espId) {
  var key = _espWsKey(espId);
  var ws  = _espWsPool[key];
  var dot = document.getElementById('esp-ws-dot-' + key);
  var ta  = document.getElementById('esp-cmd-json-' + key);
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    if (dot) { dot.style.background='#f7768e'; dot.title='Non connecté'; }
    return;
  }
  if (!ta || !ta.value.trim()) return;
  var payload;
  try {
    JSON.parse(ta.value);
    payload = ta.value.trim();
  } catch(e) {
    ta.style.borderColor = '#f7768e';
    setTimeout(function() { if (ta) ta.style.borderColor = ''; }, 1500);
    return;
  }
  ta.style.borderColor = '';
  ws.send(payload);
  if (!_espCmdLog[key]) _espCmdLog[key] = [];
  _espCmdLog[key].push({dir:'sent', msg: payload, ts: Date.now()/1000});
  if (_espCmdLog[key].length > 30) _espCmdLog[key].shift();
  _espConsolePushLog(key);
}

function _espFormatJson(key) {
  var ta = document.getElementById('esp-cmd-json-' + key);
  if (!ta || !ta.value.trim()) return;
  try {
    ta.value = JSON.stringify(JSON.parse(ta.value), null, 2);
    ta.style.borderColor = '';
  } catch(e) {
    ta.style.borderColor = '#f7768e';
    setTimeout(function() { if (ta) ta.style.borderColor = ''; }, 1500);
  }
}

function _renderEspConsole(esp) {
  var key = _espWsKey(esp.id);
  var ip  = (esp.catalog || {}).ip || (esp.meta || {}).ip || '';
  var h = '<div style="padding:12px 14px">';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">';
  h += '<div id="esp-ws-dot-' + key + '" style="width:8px;height:8px;border-radius:50%;background:#e0af68;flex-shrink:0" title="Connexion WebSocket…"></div>';
  h += '<span style="font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--muted)">CONSOLE</span>';
  if (ip) h += '<code style="font-size:10px;color:var(--muted)">ws://' + esc(ip) + '/ws</code>';
  h += '</div>';
  if (!ip) {
    h += '<p style="font-size:12px;color:var(--muted)">IP inconnue dans le catalogue — connexion directe impossible.</p>';
  } else {
    h += '<div style="margin-bottom:8px">';
    h += '<div style="font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--muted);margin-bottom:5px">TEMPLATES SCÉNARIOS</div>';
    h += '<div id="esp-tpl-' + key + '" style="font-size:11px;color:var(--muted);font-style:italic">Chargement…</div>';
    h += '</div>';
    h += '<textarea id="esp-cmd-json-' + key + '" rows="7" spellcheck="false" '
      + 'style="width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border);'
      + 'color:var(--fg);padding:8px;border-radius:6px;font-size:11px;font-family:monospace;resize:vertical;'
      + 'margin-bottom:6px;transition:border-color .2s" '
      + 'placeholder=\'{"action":"transition","options":{"red":255,"green":0,"blue":0}}\'></textarea>';
    h += '<div style="display:flex;gap:6px;margin-bottom:8px">';
    h += '<button onclick="_espSendCmd(\'' + esc(esp.id) + '\')" '
      + 'style="background:var(--accent);border:none;color:#fff;padding:5px 16px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600">&#9654; Envoyer</button>';
    h += '<button onclick="_espFormatJson(\'' + key + '\')" '
      + 'style="background:var(--surface2);border:1px solid var(--border);color:var(--fg);'
      + 'padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer">{ } Formater</button>';
    h += '</div>';
    h += '<div id="esp-ws-log-' + key + '" style="max-height:130px;overflow-y:auto;'
      + 'background:var(--surface2);border-radius:4px;padding:6px 8px;font-size:10px;'
      + 'font-family:monospace;color:var(--fg)"></div>';
  }
  return h + '</div>';
}

function _espLoadTemplates(esp) {
  var key = _espWsKey(esp.id);
  fetch('/api/esp-templates?hardware=' + encodeURIComponent(esp.id))
    .then(function(r) { return r.json(); })
    .then(function(templates) {
      _espTemplates[key] = templates;
      var tplEl = document.getElementById('esp-tpl-' + key);
      if (!tplEl) return;
      if (!templates || !templates.length) {
        tplEl.innerHTML = '<span style="font-size:11px;color:var(--muted);font-style:italic">Aucun template dans les scénarios.</span>';
        return;
      }
      tplEl.innerHTML = templates.map(function(t, i) {
        return '<button onclick="_espApplyTemplate(\'' + key + '\',' + i + ')" '
          + 'style="font-size:10px;background:var(--surface2);border:1px solid var(--border);'
          + 'color:var(--fg);padding:3px 9px;border-radius:4px;cursor:pointer;margin:2px 2px 2px 0">'
          + esc(t.scenario.replace('.json','')) + ' &middot; ' + esc(t.event || '?') + ' &middot; <b>' + esc(t.action) + '</b>'
          + '</button>';
      }).join('');
    }).catch(function() {
      var tplEl = document.getElementById('esp-tpl-' + key);
      if (tplEl) tplEl.innerHTML = '<span style="font-size:11px;color:var(--muted)">Erreur de chargement.</span>';
    });
}

function _espApplyTemplate(key, idx) {
  var templates = _espTemplates[key];
  if (!templates || !templates[idx]) return;
  var tmpl = templates[idx];
  var ta = document.getElementById('esp-cmd-json-' + key);
  if (!ta) return;
  ta.value = JSON.stringify({action: tmpl.action, options: tmpl.options || {}}, null, 2);
}

// ── Journal d'activité ────────────────────────────────────────────────────────

function _actEntry(act) {
  var col = _espStatusColor(_espEffectiveStatus({ status: act.status, updatedAt: act.ts }));
  var t = act.ts ? new Date(act.ts * 1000).toLocaleTimeString() : '';
  var scenario = act.scenario ? '<span style="font-size:9px;color:var(--muted);opacity:.6"> [' + esc(act.scenario) + ']</span>' : '';
  var recvHtml = '';
  var sentHtml = '';
  if (act.received) {
    var rObj; try { rObj = JSON.parse(act.received); } catch(ex) { rObj = null; }
    var rPrev = rObj ? JSON.stringify(rObj).slice(0, 100) : act.received.slice(0, 100);
    recvHtml = '<div style="font-family:monospace;font-size:10px;opacity:.75;margin-top:2px">'
      + '<span style="color:var(--green)">↓ </span>' + esc(rPrev) + '</div>';
  }
  if (act.sent) {
    var sObj; try { sObj = JSON.parse(act.sent); } catch(ex2) { sObj = null; }
    var sLabel = (sObj && sObj.action) ? sObj.action : act.sent.slice(0, 80);
    sentHtml = '<div style="font-family:monospace;font-size:10px;opacity:.75;margin-top:2px">'
      + '<span style="color:var(--cyan)">↑ </span>' + esc(sLabel) + '</div>';
  }
  return '<div style="display:flex;gap:10px;padding:6px 10px;border-radius:4px;border-left:2px solid ' + col + ';background:var(--surface);margin-bottom:2px">'
    + '<span style="font-size:10px;color:var(--muted);white-space:nowrap;min-width:64px;padding-top:1px">' + t + '</span>'
    + '<div style="flex:1;min-width:0">'
    +   '<span style="font-weight:700;font-size:11px;color:' + col + '">' + esc(act.espId) + '</span>'
    +   scenario
    +   recvHtml
    +   sentHtml
    + '</div>'
    + '</div>';
}

function _actRender() {
  var feed = $('act-feed');
  var status = $('act-status');
  if (!feed) return;
  if (!_actLog.length) {
    feed.innerHTML = '<div style="color:var(--muted);padding:48px 0;text-align:center;font-size:13px">Aucune activité. Lancez un scénario dans Unity.</div>';
    if (status) status.textContent = '0 événements';
    return;
  }
  var atBottom = (feed.scrollHeight - feed.scrollTop - feed.clientHeight) < 60;
  feed.innerHTML = '<div style="display:flex;flex-direction:column-reverse;gap:0">'
    + _actLog.slice(-200).reverse().map(_actEntry).join('')
    + '</div>';
  if (atBottom) feed.scrollTop = 0;
  if (status) status.textContent = _actLog.length + ' événements';
}

function renderJournal() {
  showMain(true);
  if (_espEventSource) { _espEventSource.close(); _espEventSource = null; }
  if (_espPollTimer)   { clearInterval(_espPollTimer); _espPollTimer = null; }

  $('main').innerHTML = '<h1 class="ph">Journal d\'activité</h1>'
    + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">'
    + '<span id="act-status" style="font-size:12px;color:var(--muted)">Connexion…</span>'
    + '<span style="font-size:11px;color:var(--muted);opacity:.6;margin-left:8px">Mise à jour en temps réel via SSE</span>'
    + '<button onclick="_actClear()" style="margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);padding:3px 10px;border-radius:6px;font-size:12px;cursor:pointer">&#10005; Effacer</button>'
    + '</div>'
    + '<div id="act-feed" style="max-height:calc(100vh - 160px);overflow-y:auto"></div>';

  fetch('/api/activity').then(function(r) { return r.json(); }).then(function(entries) {
    _actLog = entries;
    _actRender();
  }).catch(function() {
    var s = $('act-status');
    if (s) s.textContent = 'Erreur de connexion';
  });

  var es = new EventSource('/api/events');
  es.addEventListener('activity', function(e) {
    var entry = JSON.parse(e.data);
    _actLog.push(entry);
    if (_actLog.length > 500) _actLog.splice(0, 100);
    _actRender();
  });
  es.addEventListener('clear', function() {
    _actLog = [];
    _actRender();
  });
  es.onerror = function() {
    var s = $('act-status');
    if (s) s.textContent = (_actLog.length || '0') + ' événements (reconnexion SSE…)';
  };
  _espEventSource = es;
}

function _actClear() {
  fetch('/api/esp/clear', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' })
    .then(function() {
      _actLog = [];
      _actRender();
    });
}

function _scenarioCard(f) {
  const badge = f.registered
    ? '<span style="color:var(--green);font-size:10px">&#10003; dans ScenarioSettings.json</span>'
    : '<span style="color:var(--yellow);font-size:10px">&#9888; non enregistré</span>';
  return '<div class="mcard" onclick="go(\'scenarios\',{path:\'' + f.path + '\'})">'
    + '<div class="mcard-hd"><div class="dot" style="background:var(--accent);width:10px;height:10px"></div>'
    + '<div class="mcard-name">' + esc(f.name) + '</div></div>'
    + '<div class="mcard-meta">' + badge + '</div></div>';
}

function _scenarioList(files) {
  if (!files.length) return '<p style="color:var(--muted);font-size:13px">Aucun scénario trouvé dans StreamingAssets.</p>';
  const unreg = files.filter(function(f) { return !f.registered; });
  let html = '<div class="mgrid">' + files.map(_scenarioCard).join('') + '</div>';
  if (unreg.length) {
    html += '<div style="margin-top:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--yellow)40;border-radius:8px;font-size:12px">'
      + '<strong style="color:var(--yellow)">&#9888; ' + unreg.length + ' scénario' + (unreg.length > 1 ? 's' : '') + ' non enregistré' + (unreg.length > 1 ? 's' : '') + '</strong>'
      + '<span style="color:var(--muted);margin-left:8px">— présents dans StreamingAssets mais absents de <code>ScenarioSettings.json</code>. Ils ne seront pas chargés par l\'application.</span>'
      + '</div>';
  }
  return html;
}

function renderScenarios(filePath) {
  const files = D.scenarioFiles || [];
  if (filePath) { openScenario(filePath); return; }
  showMain(true);
  $('main').innerHTML = `
    <h1 class="ph">Scénarios <small>${files.length} fichier${files.length!==1?'s':''}</small></h1>
    ${_scenarioList(files)}

    <div style="margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600">Légende</div>
      ${[
        ['ActionEvent',      'ActionEvent.png',      SCE_COLORS.ActionEvent],
        ['InteractionEvent', 'InterActionEvent.png', SCE_COLORS.InteractionEvent],
        ['CommentEvent',     'CommentEvent.png',     SCE_COLORS.CommentEvent],
        ['Start Event',      'ActionEvent.png',      SCE_COLORS.Start],
        ['Stop Event',       'ActionEvent.png',      SCE_COLORS.Stop],
      ].map(([lbl, ico, c]) => `
        <div class="sce-leg">
          <img src="/icons/${ico}" style="width:14px;height:14px;object-fit:contain;flex-shrink:0">
          <div class="sce-node" style="background:${c.bg};border:1px solid ${c.border}"></div>
          <span style="color:${c.text}">${lbl}</span>
        </div>`).join('')}
    </div>

    <!-- Inventaire hardware -->
    ${(() => {
      const hw = D.hardwareInventory || [];
      if (!hw.length) return '';
      const byType = {};
      hw.forEach(h => {
        const t = [...new Set(h.uses.map(u=>u.type).filter(Boolean))][0] || '?';
        (byType[t] = byType[t]||[]).push(h);
      });
      return `
    <div style="margin-top:28px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap">
        <h2 style="font-size:16px;font-weight:600;margin:0">Inventaire hardware</h2>
        <span style="font-size:12px;color:var(--muted)">${hw.length} device${hw.length!==1?'s':''}</span>
        ${Object.entries(byType).map(([t,items])=>`
          <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted)"
          >${t} ${items.length}</span>`).join('')}
      </div>
      <input class="search" placeholder="Filtrer…" oninput="filterHw(this.value)"
             style="margin-bottom:10px">
      <div id="hw-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px">
        ${hw.map(h => hwCard(h)).join('')}
      </div>
    </div>`;
    })()}
  `;
}

async function openScenario(filePath) {
  showMain(false);
  GRAPH_MODE = 'scenario';
  $('graph-ctrl').style.display   = 'none';
  $('graph-legend').style.display = 'none';
  $('graph-filter-bar').style.display = 'none';
  $('scenario-detail').style.display = 'none';
  $('scenario-info').style.display   = 'flex';
  $('scenario-name').textContent = filePath.split('/').pop();
  if (NET) { NET.destroy(); NET = null; }

  try {
    const r = await fetch('/api/file?path=' + encodeURIComponent(filePath));
    const d = await r.json();
    if (d.error) { alert('Erreur : ' + d.error); return; }
    const data   = JSON.parse(d.content);
    const events = data.events || [];
    buildScenarioHTML(events);
  } catch(e) { alert('Impossible de charger le scénario : ' + e.message); }
}

function actionCardHTML(a) {
  const icon = ACTION_TYPE_ICON[a.type] || 'placeholder.png';
  const parts = (a.options?.hardware || '').split('_');
  const hw = parts.length > 2 ? parts.slice(-2).join('_') : (a.options?.hardware || '');
  const cmd = (a.action || a.type || '').replace(/_/g, ' ');
  return `<div class="sce-act-card">
    <img src="/icons/${icon}" class="sce-act-icon" onerror="this.src='/icons/placeholder.png'">
    <div class="sce-act-info">
      <div class="sce-act-cmd">${esc(cmd)}</div>
      ${hw ? `<div class="sce-act-hw">${esc(hw)}</div>` : ''}
    </div>
  </div>`;
}

function buildScenarioHTML(events) {
  const container = $('graph-canvas');
  if (!container) return;
  if (NET) { NET.destroy(); NET = null; }
  container.innerHTML = '';

  const SCALE = 65, PAD = 60;
  const xs = events.map(e => (e.interface?.coordinate||[0,0])[0]);
  const ys = events.map(e => (e.interface?.coordinate||[0,0])[1]);
  const minX = Math.min(...xs), maxY = Math.max(...ys);

  const pz = document.createElement('div');
  pz.id = 'sce-panzoom';

  const vp = document.createElement('div');
  vp.id = 'sce-viewport';

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.id = 'sce-edges';
  svg.style.cssText = 'position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:0';
  svg.innerHTML = `<defs><marker id="sce-arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
    <polygon points="0 0,7 3,0 6" fill="rgba(255,255,255,.55)"/></marker></defs>`;
  vp.appendChild(svg);

  events.forEach(ev => {
    const [cx, cy] = ev.interface?.coordinate || [0,0];
    const x = (cx - minX) * SCALE + PAD;
    const y = (maxY - cy) * SCALE + PAD;
    const cols = sceNodeCols(ev);
    const nd = document.createElement('div');
    nd.dataset.id = ev.id;
    nd.style.left = x + 'px';
    nd.style.top  = y + 'px';

    if (ev.event_type === 'CommentEvent') {
      nd.className = 'sce-comment-box';
      nd.style.background  = cols.bg;
      nd.style.borderColor = cols.border;
      nd.innerHTML = `<span style="color:${cols.text}">${esc(ev.interface?.name||'')}</span>`;
    } else {
      nd.className = 'sce-event-node';
      nd.style.background  = cols.bg;
      nd.style.borderColor = cols.border;
      const typeIcon = SCE_EVENT_ICON[ev.event_type] || 'placeholder.png';
      const acts = ev.actions || [];
      nd.innerHTML = `
        <div class="sce-node-header" style="border-bottom:1px solid rgba(255,255,255,.08)">
          <img src="/icons/${typeIcon}" class="sce-type-icon" onerror="this.style.display='none'">
          <span class="sce-node-name" style="color:${cols.text}">${esc(ev.interface?.name||'')}</span>
          <span class="sce-duration-badge">${ev.duration}s</span>
        </div>
        ${acts.length
          ? `<div class="sce-node-actions">${acts.map(a => actionCardHTML(a)).join('')}</div>`
          : `<div style="padding:3px 8px;font-size:9px;color:rgba(255,255,255,.2)">—</div>`}`;
    }
    nd.addEventListener('click', e => { e.stopPropagation(); showSceNodeDetail(ev, cols); });
    vp.appendChild(nd);
  });

  // Fit button
  const fitBtn = document.createElement('button');
  fitBtn.className = 'gbtn';
  fitBtn.style.cssText = 'position:absolute;bottom:10px;right:10px;z-index:10;padding:4px 10px;font-size:14px';
  fitBtn.title = 'Ajuster la vue'; fitBtn.textContent = '⤢';
  pz.appendChild(vp);
  pz.appendChild(fitBtn);
  container.appendChild(pz);

  requestAnimationFrame(() => {
    _drawSceEdges(events, vp, svg, svgNS);
    const { fit } = _setupScePanZoom(pz, vp);
    fitBtn.addEventListener('click', e => { e.stopPropagation(); fit(); });
    fit();
  });
  pz.addEventListener('click', () => { const d=$('scenario-detail'); if(d) d.style.display='none'; });
}

function showSceNodeDetail(ev, cols) {
  const detail = $('scenario-detail');
  if (!detail) return;
  const acts = ev.actions || [];
  detail.style.display = 'block';
  detail.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <div style="width:10px;height:10px;border-radius:2px;background:${cols.bg};border:1px solid ${cols.border};flex-shrink:0"></div>
      <strong>${esc(ev.interface?.name || ev.id)}</strong>
      <button onclick="this.parentElement.parentElement.style.display='none'"
        style="margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer">✕</button>
    </div>
    <div style="color:var(--muted);margin-bottom:6px">
      ${ev.event_type} · <span style="color:${cols.text}">${ev.event_role}</span> · ${ev.duration}s
    </div>
    ${acts.length ? `
      <div style="font-weight:600;margin-bottom:4px">Actions (${acts.length})</div>
      ${acts.slice(0,10).map(a => `
        <div style="padding:2px 0;border-bottom:1px solid var(--border);color:var(--muted)">
          <span style="color:var(--text)">${esc(a.action||'?')}</span>
          <span style="font-size:10px"> · ${esc(a.type||'')}</span>
          ${a.options?.hardware
            ? `<div style="font-size:10px;color:var(--border)">${esc(a.options.hardware)}</div>` : ''}
        </div>`).join('')}
      ${acts.length>10?`<div style="font-size:11px;color:var(--border);padding-top:3px">+${acts.length-10} autres</div>`:''}
    ` : '<span style="color:var(--muted)">Aucune action</span>'}`;
}

function _drawSceEdges(events, vp, svg, svgNS) {
  events.filter(ev => ev.next_event_id).forEach(ev => {
    const src = vp.querySelector(`[data-id="${ev.id}"]`);
    const dst = vp.querySelector(`[data-id="${ev.next_event_id}"]`);
    if (!src || !dst) return;
    const fx = src.offsetLeft + src.offsetWidth / 2;
    const fy = src.offsetTop  + src.offsetHeight;
    const tx = dst.offsetLeft + dst.offsetWidth / 2;
    const ty = dst.offsetTop;
    const bend = Math.max(Math.abs(ty - fy) * 0.35, 30);
    const d = `M ${fx} ${fy} C ${fx} ${fy+bend}, ${tx} ${ty-bend}, ${tx} ${ty}`;
    const cols = sceNodeCols(ev);
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', cols.text);
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('opacity', '0.6');
    path.setAttribute('marker-end', 'url(#sce-arr)');
    svg.appendChild(path);
  });
}

function _setupScePanZoom(pz, vp) {
  let tx=0, ty=0, sc=1, drag=false, lx=0, ly=0;
  const apply = () => { vp.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };

  function fit() {
    const cr = pz.getBoundingClientRect();
    const nodes = Array.from(vp.querySelectorAll('.sce-event-node,.sce-comment-box'));
    if (!nodes.length) return;
    let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
    nodes.forEach(n => {
      const l=parseFloat(n.style.left)||0, t=parseFloat(n.style.top)||0;
      x1=Math.min(x1,l); y1=Math.min(y1,t);
      x2=Math.max(x2,l+(n.offsetWidth||210)); y2=Math.max(y2,t+(n.offsetHeight||80));
    });
    const P=50, cw=x2-x1+P*2, ch=y2-y1+P*2;
    sc = Math.min(cr.width/cw, cr.height/ch, 1.1);
    tx = (cr.width  - cw*sc)/2 - (x1-P)*sc;
    ty = (cr.height - ch*sc)/2 - (y1-P)*sc;
    apply();
  }

  pz.addEventListener('mousedown', e => {
    if (e.target.closest('.sce-event-node,.sce-comment-box,.gbtn')) return;
    drag=true; lx=e.clientX; ly=e.clientY;
    pz.classList.add('pz-dragging'); e.preventDefault();
  });
  document.addEventListener('mouseup', () => { drag=false; pz.classList.remove('pz-dragging'); });
  document.addEventListener('mousemove', e => {
    if (!drag) return;
    tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; apply();
  });
  pz.addEventListener('wheel', e => {
    e.preventDefault();
    const r=pz.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const f=e.deltaY>0?.85:1.18, ns=Math.max(.1,Math.min(3,sc*f));
    tx=mx-(mx-tx)*(ns/sc); ty=my-(my-ty)*(ns/sc); sc=ns; apply();
  }, {passive:false});

  return { fit };
}


// ── Recherche full-text ───────────────────────────────────────────────────────
function renderSearch(q) {
  showMain(true);
  $('main').innerHTML = `
    <h1 class="ph">Recherche <small style="font-size:12px">Ctrl+K</small></h1>
    <input class="search" id="global-search" value="${esc(q)}"
           placeholder="Rechercher dans tout le code, docs, JSON… (min. 2 car.)"
           oninput="onSearchInput(this.value)">
    <div id="search-results" style="margin-top:4px">
      ${q.length >= 2 ? '<span style="color:var(--muted);font-size:13px">Recherche…</span>' : ''}
    </div>`;
  $('global-search').focus();
  if (q.length >= 2) doSearch(q);
}

function onSearchInput(q) {
  clearTimeout(_searchTimer);
  history.replaceState(null, '', '#search' + (q ? SEP + encodeURIComponent(q) : ''));
  if (q.length < 2) { $('search-results').innerHTML = ''; return; }
  $('search-results').innerHTML = '<span style="color:var(--muted);font-size:13px">Recherche…</span>';
  _searchTimer = setTimeout(() => doSearch(q), 280);
}

async function doSearch(q) {
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q));
    const d = await r.json();
    const el = $('search-results');
    if (!el) return;
    if (!d.results?.length) {
      el.innerHTML = '<span style="color:var(--muted);font-size:13px">Aucun résultat.</span>';
      return;
    }
    const qEsc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re   = new RegExp(qEsc, 'gi');
    el.innerHTML = `
      <div style="color:var(--muted);font-size:12px;margin-bottom:10px">
        ${d.total} occurrence${d.total>1?'s':''} dans ${d.results.length} fichier${d.results.length>1?'s':''}
      </div>
      ${d.results.map(f => `
        <div class="refs-file">
          <div class="refs-fname" onclick="go('file',{path:'${f.file}',mod:''})">${esc(f.file)}</div>
          ${f.matches.map(m => `
            <div class="refs-line">L${m.line}&nbsp; ${esc(m.text).replace(re, match => `<em>${match}</em>`)}</div>
          `).join('')}
          ${f.total > f.matches.length ? `<div style="font-size:11px;color:var(--border);padding:2px 8px">+${f.total-f.matches.length} lignes</div>` : ''}
        </div>`).join('')}`;
  } catch(e) {
    const el = $('search-results');
    if (el) el.innerHTML = `<span style="color:var(--red)">Erreur : ${esc(e.message)}</span>`;
  }
}

// ── CSV ───────────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { headers: [], rows: [] };
  const nComma = (lines[0].match(/,/g)||[]).length;
  const nSemi  = (lines[0].match(/;/g)||[]).length;
  const sep    = nSemi > nComma ? ';' : ',';
  function parseLine(line) {
    const cells = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
      else if (ch === sep && !inQ) { cells.push(cur); cur = ''; }
      else cur += ch;
    }
    cells.push(cur);
    return cells;
  }
  return { headers: parseLine(lines[0]), rows: lines.slice(1).map(parseLine) };
}

function renderCsvContent(content) {
  const { headers, rows } = parseCSV(content);
  _csvRows = rows.slice(); _csvSortCol = -1; _csvSortAsc = true;
  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <input class="search" id="csv-filter" style="margin:0;flex:1"
             placeholder="Filtrer les lignes…" oninput="filterCsvRows(this.value)">
      <span style="font-size:12px;color:var(--muted);flex-shrink:0" id="csv-count">${rows.length} lignes</span>
    </div>
    <div class="csv-wrap">
      <table class="csv-tbl">
        <thead><tr>${headers.map((h,i) => `<th onclick="sortCsv(${i})">${esc(h)} <span style="color:var(--border)">↕</span></th>`).join('')}</tr></thead>
        <tbody id="csv-body">${csvRowsHtml(_csvRows)}</tbody>
      </table>
    </div>`;
}

function csvRowsHtml(rows) {
  const q = $('csv-filter')?.value.toLowerCase() || '';
  const visible = q ? rows.filter(r => r.some(c => c.toLowerCase().includes(q))) : rows;
  if ($('csv-count')) $('csv-count').textContent = `${visible.length} / ${_csvRows.length} lignes`;
  return visible.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
}

function filterCsvRows(q) {
  const el = $('csv-body'); if (!el) return;
  q = q.toLowerCase();
  const visible = q ? _csvRows.filter(r => r.some(c => c.toLowerCase().includes(q))) : _csvRows;
  if ($('csv-count')) $('csv-count').textContent = `${visible.length} / ${_csvRows.length} lignes`;
  el.innerHTML = visible.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
}

function sortCsv(col) {
  _csvSortAsc = _csvSortCol === col ? !_csvSortAsc : true;
  _csvSortCol = col;
  _csvRows.sort((a, b) => {
    const va = a[col] || '', vb = b[col] || '';
    const n = parseFloat(va) - parseFloat(vb);
    if (!isNaN(n)) return _csvSortAsc ? n : -n;
    return _csvSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  filterCsvRows($('csv-filter')?.value || '');
}

// ── Dead code ─────────────────────────────────────────────────────────────────
function toggleDeadCode() {
  SHOW_DEAD_ONLY = !SHOW_DEAD_ONLY;
  $('dead-btn').classList.toggle('on', SHOW_DEAD_ONLY);
  filterCls($('cls-search')?.value || '');
}

// ── Wiki Links ────────────────────────────────────────────────────────────────
function resolveWikiLinks(text) {
  if (!D) return text;
  return text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, target, label) => {
    const name    = target.trim();
    const display = (label || target).trim();
    const cls = D.classes.find(c => c.name === name);
    if (cls) return `[${display}](#class${SEP}${name})`;
    const mod = D.modules.find(m => m.name === name);
    if (mod) return `[${display}](#module${SEP}${name})`;
    const doc = (D.projectDocs || []).find(d => d.name === name);
    if (doc) return `[${display}](#file${SEP}${encodeURIComponent(doc.path)}${SEP})`;
    return `<span class="wiki-unresolved" title="Lien non résolu">[[${display}]]</span>`;
  });
}

function parseMd(text) {
  return marked.parse(resolveWikiLinks(text));
}

// ── Methods ───────────────────────────────────────────────────────────────────
function methodRow(m) {
  const mods = m.mods.length ? m.mods.join(' ') + ' ' : '';
  const acc  = m.access === 'public' ? `<span style="color:var(--green)">${m.access}</span>`
             : m.access === 'protected' ? `<span style="color:var(--yellow)">${m.access}</span>`
             : `<span style="color:var(--muted)">${m.access}</span>`;
  return `<div class="method-item">
    <div class="method-sig">${acc}${mods
      ? ` <span style="color:var(--muted);font-style:italic">${esc(mods)}</span>` : ''
    } <span style="color:var(--cyan)">${esc(m.ret)}</span> <span style="color:var(--accent);font-weight:600">${esc(m.name)}</span><span style="color:var(--muted)">(${esc(m.params)})</span></div>
    ${m.desc ? `<div class="method-desc">${esc(m.desc)}</div>` : ''}
  </div>`;
}

// ── Project Docs ──────────────────────────────────────────────────────────────
function showNewProjectDocForm() {
  const form = $('proj-doc-form');
  if (form) { form.style.display = ''; $('proj-doc-name').focus(); }
}
function hideNewProjectDocForm() {
  const form = $('proj-doc-form');
  if (form) form.style.display = 'none';
}

async function saveNewProjectDoc() {
  const name = $('proj-doc-name').value.trim().replace(/\.md$/i, '');
  if (!name) { $('proj-doc-name').focus(); return; }
  const content = $('proj-doc-content').value;
  const filePath = `_wiki/${name}.md`;
  try {
    const r = await fetch('/api/file-write', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: filePath, content})
    });
    const d = await r.json();
    if (d.error) { alert('Erreur : ' + d.error); return; }
    const r2 = await fetch('/api/scan');
    D = await r2.json();
    D.modules.forEach(m => col(m.name));
    renderSidebar();
    go('home');
  } catch(e) { alert('Erreur : ' + e.message); }
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function load() {
  // Intercepteur de clics sur liens wiki rendus dans le markdown
  $('main').addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if (a) { e.preventDefault(); goFromHash(a.getAttribute('href').slice(1)); }
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      go('search');
    }
  });

  try {
    const r = await fetch('/api/scan');
    D = await r.json();
    D.modules.forEach(m => col(m.name));
    renderSidebar();
    const initHash = location.hash.slice(1);
    if (initHash) goFromHash(initHash);
    else _render('home', {});
  } catch(e) {
    $('loading').textContent = 'Impossible de joindre le serveur : ' + e.message;
  }
}

async function reload() {
  const btn = $('refresh-btn');
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const r = await fetch('/api/scan');
    D = await r.json();
    D.modules.forEach(m => col(m.name));
    renderSidebar();
    go('home');
  } finally {
    btn.textContent = '↺ Actualiser';
    btn.disabled = false;
  }
}

load();
</script>
