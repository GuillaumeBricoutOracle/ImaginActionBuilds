<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImaginAction Wiki</title>
<link rel="icon" type="image/png" href="/icons/Logo_mini_Noir.png">
<style>
:root {
  --bg:      #1a1b26;
  --surface: #24283b;
  --surface2:#2f3350;
  --border:  #414868;
  --text:    #c0caf5;
  --muted:   #565f89;
  --accent:  #7aa2f7;
  --green:   #9ece6a;
  --yellow:  #e0af68;
  --red:     #f7768e;
  --purple:  #bb9af7;
  --cyan:    #7dcfff;
  --orange:  #ff9e64;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}

/* ── Header ── */
#hdr{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:0 18px; height:48px;
  display:flex; align-items:center; gap:20px; flex-shrink:0;
}
.logo{ font-size:15px; font-weight:700; color:var(--accent); letter-spacing:.4px; white-space:nowrap; }
.logo em{ color:var(--purple); font-style:normal; }
nav{ display:flex; gap:2px; }
nav button{
  background:none; border:none; color:var(--muted);
  padding:5px 13px; border-radius:6px; cursor:pointer; font-size:13px; transition:.12s;
}
nav button:hover{ background:var(--border); color:var(--text); }
nav button.on{ background:var(--accent); color:#1a1b26; font-weight:600; }
.hdr-spacer{ flex:1; }
#refresh-btn{
  background:none; border:1px solid var(--border); color:var(--muted);
  padding:4px 10px; border-radius:6px; cursor:pointer; font-size:12px; transition:.12s;
}
#refresh-btn:hover{ border-color:var(--accent); color:var(--accent); }

/* ── Layout ── */
#layout{ display:flex; flex:1; overflow:hidden; }

/* ── Sidebar ── */
#sb{
  width:220px; background:var(--surface); border-right:1px solid var(--border);
  overflow-y:auto; flex-shrink:0; padding:8px 0;
}
.sb-title{
  font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:1.2px; color:var(--muted); padding:10px 14px 4px;
}
.mi{
  display:flex; align-items:center; gap:7px;
  padding:5px 14px; border-radius:5px; cursor:pointer; font-size:13px; transition:.1s;
}
.mi:hover{ background:var(--border); }
.mi.on{ background:rgba(122,162,247,.15); color:var(--accent); }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.badge{
  margin-left:auto; font-size:10px;
  background:var(--border); color:var(--muted); border-radius:10px; padding:1px 6px;
}

/* ── Main ── */
#main{ flex:1; overflow-y:auto; padding:22px 26px; position:relative; }

/* ── Graph wrapper (replaces main padding) ── */
#graph-wrap{
  flex:1; position:relative; overflow:hidden; display:none;
}
#graph-canvas{ width:100%; height:100%; position:relative; }
#graph-ctrl{
  position:absolute; top:12px; right:12px;
  display:flex; gap:6px; z-index:10;
}
.gbtn{
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:5px 12px; border-radius:6px; cursor:pointer; font-size:12px; transition:.12s;
}
.gbtn:hover{ border-color:var(--accent); }
.gbtn.on{ background:var(--accent); color:#1a1b26; border-color:var(--accent); }
#graph-legend{
  position:absolute; bottom:12px; right:12px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:10px 14px; font-size:11px; z-index:10;
}
.leg{ display:flex; align-items:center; gap:7px; margin-bottom:4px; }
.leg:last-child{ margin-bottom:0; }
.leg-line{ width:22px; height:2px; flex-shrink:0; }

/* ── Cards & grids ── */
.stats{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px; margin-bottom:22px;
}
.stat{
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:14px; text-align:center;
}
.stat-n{ font-size:30px; font-weight:700; color:var(--accent); }
.stat-l{ font-size:11px; color:var(--muted); margin-top:3px; }

.mgrid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px;
}
.mcard{
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:14px; cursor:pointer; transition:.12s;
}
.mcard:hover{ border-color:var(--accent); transform:translateY(-1px); }
.mcard-hd{ display:flex; align-items:center; gap:9px; margin-bottom:6px; }
.mcard-hd .dot{ width:10px; height:10px; }
.mcard-name{ font-weight:600; font-size:14px; }
.mcard-meta{ font-size:12px; color:var(--muted); display:flex; gap:12px; }
.mcard-desc{
  font-size:11px; color:var(--muted); border-top:1px solid var(--border);
  padding-top:6px; line-height:1.5;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ── Class list ── */
.cls-list{ list-style:none; }
.cli{
  display:flex; align-items:center; gap:7px;
  padding:6px 0; border-bottom:1px solid var(--border);
  font-size:13px; cursor:pointer;
}
.cli:hover .cli-name{ color:var(--accent); }
.kbadge{
  font-size:10px; font-weight:600; padding:2px 6px;
  border-radius:4px; text-transform:uppercase; flex-shrink:0;
}
.k-class    { background:rgba(122,162,247,.18); color:var(--accent); }
.k-interface{ background:rgba(187,154,247,.18); color:var(--purple); }
.k-abstract { background:rgba(224,175,104,.18); color:var(--yellow); }
.k-struct   { background:rgba(158,206,106,.18); color:var(--green); }
.k-enum     { background:rgba(255,158,100,.18); color:var(--orange); }
.mod-chip{
  font-size:10px; padding:1px 6px; border-radius:10px; flex-shrink:0;
}

/* ── File list ── */
.fentry{
  display:flex; align-items:center; gap:7px;
  padding:5px 0; border-bottom:1px solid var(--border);
  font-size:12px; cursor:pointer; color:var(--muted);
}
.fentry:hover{ color:var(--accent); }
.fext{ font-size:10px; font-weight:600; padding:1px 5px; border-radius:3px;
       background:var(--border); color:var(--muted); flex-shrink:0; }
.fpath{ margin-left:auto; font-size:10px; color:var(--border); }

/* ── Card generic ── */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:14px; margin-bottom:10px;
}
.card-t{ font-size:14px; font-weight:600; margin-bottom:10px; }

/* ── Tabs ── */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:14px; }
.tab{
  background:none; border:none; border-bottom:2px solid transparent;
  color:var(--muted); padding:6px 14px; cursor:pointer; font-size:13px;
  margin-bottom:-1px; transition:.12s;
}
.tab:hover{ color:var(--text); }
.tab.on{ color:var(--accent); border-bottom-color:var(--accent); }

/* ── Relations ── */
.rtags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.rtag{
  font-size:11px; padding:2px 9px; border-radius:12px;
  border:1px solid var(--border); cursor:pointer; transition:.1s;
}
.rtag:hover{ border-color:var(--accent); color:var(--accent); }
.rtag.inherits  { border-color:var(--cyan);   color:var(--cyan); }
.rtag.implements{ border-color:var(--purple); color:var(--purple); }

/* ── Page header ── */
h1.ph{ font-size:20px; font-weight:700; margin-bottom:18px; }
h1.ph small{ font-size:14px; color:var(--muted); font-weight:400; margin-left:8px; }

/* ── Inputs ── */
.search{
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:7px 13px; color:var(--text); font-size:13px;
  margin-bottom:14px; outline:none;
}
.search:focus{ border-color:var(--accent); }

/* ── Back btn ── */
.back{
  background:none; border:1px solid var(--border); color:var(--muted);
  padding:4px 11px; border-radius:6px; cursor:pointer; font-size:12px;
  margin-bottom:14px; transition:.12s;
}
.back:hover{ border-color:var(--accent); color:var(--accent); }

/* ── File viewer ── */
pre.code{
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:14px; overflow-x:auto; font-size:12px; line-height:1.6;
  font-family:'Cascadia Code','Fira Code',Consolas,monospace;
  white-space:pre; tab-size:4;
}
.md-body{ line-height:1.75; max-width:760px; }
.md-body h1{ font-size:21px; margin-bottom:14px; border-bottom:1px solid var(--border); padding-bottom:7px; }
.md-body h2{ font-size:17px; margin:22px 0 10px; }
.md-body h3{ font-size:14px; margin:16px 0 7px; color:var(--accent); }
.md-body p { margin-bottom:10px; }
.md-body code{ background:var(--surface); border:1px solid var(--border); border-radius:3px; padding:1px 5px; font-family:monospace; font-size:12px; }
.md-body pre{ margin:10px 0; }
.md-body ul,
.md-body ol{ margin:7px 0 10px 20px; }
.md-body li{ margin-bottom:3px; }

/* ── Sidebar graph btn ── */
.sb-graph-btn{
  background:none; border:none; color:var(--border); cursor:pointer;
  font-size:11px; padding:0 2px; line-height:1; transition:.1s; flex-shrink:0;
}
.sb-graph-btn:hover{ color:var(--accent); }
.sb-graph-btn.on{ color:var(--accent); }

/* ── Graph filter bar ── */
#graph-filter-bar{
  position:absolute; top:12px; left:12px;
  display:flex; align-items:center; gap:6px; z-index:10;
  background:var(--surface); border:1px solid var(--accent);
  border-radius:6px; padding:4px 10px; font-size:12px; color:var(--accent);
}
#graph-filter-bar button{
  background:none; border:none; color:var(--accent); cursor:pointer; font-size:13px; line-height:1;
}

/* ── Health bar ── */
.health-bar{
  height:3px; border-radius:2px; margin-top:8px;
  background:var(--border); overflow:hidden;
}
.health-fill{ height:100%; border-radius:2px; transition:.3s; }

/* ── Cycle warning ── */
.cycle-warn{
  background:rgba(247,118,142,.1); border:1px solid var(--red);
  border-radius:8px; padding:12px 14px; margin-bottom:12px;
  font-size:13px;
}
.cycle-warn .cycle-t{ color:var(--red); font-weight:600; margin-bottom:6px; }
.cycle-path{ font-size:11px; color:var(--muted); font-family:monospace; }

/* ── Refs list ── */
.refs-file{ margin-bottom:10px; }
.refs-fname{ font-size:12px; color:var(--accent); margin-bottom:4px; cursor:pointer; }
.refs-fname:hover{ text-decoration:underline; }
.refs-line{
  font-size:11px; font-family:monospace; color:var(--muted);
  padding:2px 8px; line-height:1.5;
  border-left:2px solid var(--border);
}
.refs-line em{ color:var(--yellow); font-style:normal; }

/* ── Loading ── */
#loading{ display:flex; align-items:center; justify-content:center; flex:1; font-size:14px; color:var(--muted); }

/* ── Wiki links ── */
.wiki-unresolved{ color:var(--red); opacity:.7; font-family:monospace; font-size:.9em; }
.md-body a{ color:var(--accent); text-decoration:none; }
.md-body a:hover{ text-decoration:underline; }
.md-body table{ border-collapse:collapse; width:100%; margin:10px 0; }
.md-body th,.md-body td{ border:1px solid var(--border); padding:5px 10px; font-size:12px; }
.md-body th{ background:var(--surface2); }

/* ── CSV table ── */
.csv-wrap{ overflow-x:auto; }
.csv-tbl{ width:100%; border-collapse:collapse; font-size:12px; }
.csv-tbl th{
  text-align:left; padding:6px 10px; background:var(--surface2);
  border:1px solid var(--border); cursor:pointer; white-space:nowrap;
  user-select:none; position:sticky; top:0;
}
.csv-tbl th:hover{ background:var(--border); }
.csv-tbl td{ padding:5px 10px; border:1px solid var(--border); vertical-align:top; }
.csv-tbl tr:nth-child(even) td{ background:rgba(255,255,255,.02); }

/* ── Scenario graph ── */
#scenario-info{
  position:absolute; left:12px; top:12px; z-index:10; display:none;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:6px 10px;
  display:none; align-items:center; gap:8px; font-size:12px;
}
#scenario-detail{
  position:absolute; left:12px; bottom:12px; z-index:10; display:none;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:12px 14px; max-width:300px; font-size:12px;
}
.sce-leg{ display:flex; align-items:center; gap:6px; margin-bottom:3px; font-size:11px; }
.sce-node{ width:12px; height:12px; border-radius:2px; flex-shrink:0; }

/* ── Scenario HTML renderer ── */
#sce-panzoom{ position:absolute; inset:0; overflow:hidden; cursor:grab; user-select:none; }
#sce-panzoom.pz-dragging{ cursor:grabbing; }
#sce-viewport{ position:absolute; transform-origin:0 0; }
.sce-event-node{
  position:absolute; border-radius:6px; border:1px solid; overflow:hidden;
  width:210px; cursor:pointer; z-index:1; transition:box-shadow .15s;
}
.sce-event-node:hover{ box-shadow:0 0 0 2px rgba(255,255,255,.22); }
.sce-event-node.sce-sel{ box-shadow:0 0 0 2px #fff; z-index:2; }
.sce-comment-box{
  position:absolute; border-radius:4px; border:1px solid; cursor:pointer;
  padding:8px 10px; max-width:150px; font-size:11px; z-index:1;
}
.sce-node-header{ display:flex; align-items:center; gap:5px; padding:6px 8px; }
.sce-type-icon{ width:16px; height:16px; object-fit:contain; flex-shrink:0; }
.sce-node-name{ font-size:11px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sce-duration-badge{ font-size:10px; background:rgba(0,0,0,.35); padding:1px 5px; border-radius:8px; flex-shrink:0; color:#eee; }
.sce-node-actions{ display:flex; flex-wrap:wrap; gap:3px; padding:5px; }
.sce-act-card{
  display:flex; align-items:center; gap:4px;
  background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.1);
  border-radius:4px; padding:3px 5px;
  width:calc(50% - 1.5px); box-sizing:border-box; overflow:hidden;
}
.sce-act-icon{ width:14px; height:14px; object-fit:contain; flex-shrink:0; }
.sce-act-info{ display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.sce-act-cmd{ font-size:9px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#eee; }
.sce-act-hw{ font-size:8px; color:rgba(255,255,255,.45); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ── Method list ── */
.method-item{
  padding:8px 0; border-bottom:1px solid var(--border);
}
.method-item:last-child{ border-bottom:none; }
.method-sig{ font-family:monospace; font-size:12px; line-height:1.5; word-break:break-all; }
.method-desc{ font-size:12px; color:var(--muted); margin-top:3px; padding-left:4px; }

/* ── Scrollbar ── */
::-webkit-scrollbar{ width:5px; height:5px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover{ background:var(--muted); }
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">
    <img src="/icons/Logo_mini_Noir.png" style="height:22px;width:22px;object-fit:contain;flex-shrink:0" onerror="this.style.display='none'">
    ImaginAction <em>Wiki</em>
  </div>
  <nav>
    <button id="tn-home"      onclick="go('home')"             class="on">Accueil</button>
    <button id="tn-graph"     onclick="go('graph')"                    >Architecture</button>
    <button id="tn-scenarios" onclick="go('scenarios')"               >Scénarios</button>
    <button id="tn-classes"   onclick="go('classes')"                 >Classes</button>
    <button id="tn-analyse"   onclick="go('analyse')"                 >Analyse</button>
    <button id="tn-prefabs"   onclick="go('prefabs')"                 >Ressources</button>
    <button id="tn-esp"       onclick="go('esp')"                     >ESP</button>
    <button id="tn-journal"   onclick="go('journal')"                 >Journal</button>
  </nav>
  <div class="hdr-spacer"></div>
  <button id="tn-search" onclick="go('search')" title="Ctrl+K" style="background:none;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;margin-right:6px">⌕ Recherche</button>
  <button id="refresh-btn" onclick="reload()">↺ Actualiser</button>
</div>

<div id="layout">
  <div id="sb">
    <div class="sb-title">Modules</div>
    <div id="sb-mods"></div>

    <div class="sb-title" style="margin-top:14px">Types</div>
    <div style="padding:2px 14px 10px;display:flex;flex-direction:column;gap:5px">
      <div style="display:flex;align-items:center;gap:7px;font-size:11px">
        <span class="kbadge k-class"    style="font-size:9px">class</span>
        <span style="color:var(--muted)">sans parent</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;font-size:11px">
        <span class="kbadge k-abstract" style="font-size:9px">class</span>
        <span style="color:var(--muted)">hérite / implémente</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;font-size:11px">
        <span class="kbadge k-interface" style="font-size:9px">interface</span>
        <span style="color:var(--muted)">interface</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;font-size:11px">
        <span class="kbadge k-enum"   style="font-size:9px">enum</span>
        <span style="color:var(--muted)">énumération</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;font-size:11px">
        <span class="kbadge k-struct" style="font-size:9px">struct</span>
        <span style="color:var(--muted)">structure</span>
      </div>
    </div>

    <div class="sb-title" style="margin-top:6px">Dépendances</div>
    <div style="padding:2px 14px 10px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:7px;font-size:11px">
        <div style="width:22px;height:2px;background:var(--cyan);flex-shrink:0"></div>
        <span style="color:var(--muted)">hérite de</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;font-size:11px">
        <div style="width:22px;height:0;border-top:2px dashed var(--purple);flex-shrink:0"></div>
        <span style="color:var(--muted)">implémente</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;font-size:11px">
        <div style="width:22px;height:0;border-top:2px dotted var(--yellow);flex-shrink:0"></div>
        <span style="color:var(--muted)">utilise (champ)</span>
      </div>
    </div>
  </div>

  <!-- vue normale -->
  <div id="main"><div id="loading">Chargement…</div></div>

  <!-- vue graphe (remplace main) -->
  <div id="graph-wrap">
    <div id="graph-canvas"></div>
    <!-- Overlay retour scénario -->
    <div id="scenario-info">
      <button class="gbtn" style="padding:2px 8px;font-size:11px" onclick="go('scenarios')">← Scénarios</button>
      <span id="scenario-name" style="color:var(--accent)"></span>
    </div>
    <!-- Détail event (clic nœud) -->
    <div id="scenario-detail"></div>
    <div id="graph-filter-bar" style="display:none">
      <span id="graph-filter-label"></span>
      <button onclick="clearGraphFilter()" title="Effacer le filtre">✕</button>
    </div>
    <div id="graph-ctrl">
      <button class="gbtn on" id="gbn-mod" onclick="switchLevel('module')">Modules</button>
      <button class="gbtn"    id="gbn-cls" onclick="switchLevel('class')" >Classes</button>
      <div style="width:1px;background:var(--border);margin:0 2px"></div>
      <button class="gbtn"    id="gbn-layers" onclick="toggleLayers()" title="Réarranger par couche d'architecture (stable en bas, application en haut)">Couches</button>
      <button class="gbtn"    id="gbn-uses" onclick="toggleUses()" title="Afficher/masquer les dépendances 'utilise'">Utilise</button>
      <button class="gbtn"    id="gbn-freeze" onclick="toggleFreeze()" title="Geler/dégeler la physique">❙❙</button>
    </div>
    <div id="graph-legend">
      <div class="leg"><div class="leg-line" style="background:var(--cyan)"></div><span>hérite de</span></div>
      <div class="leg"><div class="leg-line" style="background:var(--purple);border-top:2px dashed var(--purple)"></div><span>implémente</span></div>
      <div class="leg"><div class="leg-line" style="background:var(--yellow);border-top:2px dotted var(--yellow)"></div><span>utilise</span></div>
    </div>
  </div>
</div>

<!-- Libs locales (servies par server.py depuis Wiki/lib/) — fonctionne hors-ligne -->
<script src="/lib/vis-network.min.js"></script>
<script src="/lib/marked.min.js"></script>

<script>
'use strict';

// ── État ─────────────────────────────────────────────────────────────────────
let D = null;             // données du scan
let NET = null;           // instance vis.js
let LEVEL = 'module';     // niveau du graphe

function _selectEspDetail(id) {
  var prev = _espDetailId;
  _espDetailId = (_espDetailId === id) ? null : id;
  if (prev && prev !== _espDetailId) _espDisconnectWs(prev);
  var p = $('esp-detail-panel');
  if (!p) return;
  if (!_espDetailId) {
    p.style.display = 'none';
    p.innerHTML = '';
    return;
  }
  p.style.display = '';
  var cached = _espLatestData[_espDetailId];
  if (cached) {
    var dkey = _espWsKey(_espDetailId);
    if (!document.getElementById('esp-dc-' + dkey)) {
      p.innerHTML = _espDetailHtml(cached, dkey);
      _espConnectWs(cached);
      _espLoadTemplates(cached);
    }
  }
}

// ── Palette de couleurs par module ───────────────────────────────────────────
const PAL = ['#7aa2f7','#bb9af7','#9ece6a','#e0af68','#f7768e',
             '#73daca','#ff9e64','#2ac3de','#a9b1d6','#c3e88d',
             '#ff6e5b','#1abc9c'];
const _colCache = {};
let _colIdx = 0;
function col(name) {
  if (!_colCache[name]) _colCache[name] = PAL[_colIdx++ % PAL.length];
  return _colCache[name];
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function kindCss(c) {
  if (c.kind === 'interface') return 'k-interface';
  if (c.kind === 'enum')      return 'k-enum';
  if (c.kind === 'struct')    return 'k-struct';
  if (c.inherits?.length || c.implements?.length) return 'k-abstract';
  return 'k-class';
}

function setNav(view) {
  ['home','graph','scenarios','classes','analyse','prefabs','esp','journal','search'].forEach(v => $(`tn-${v}`)?.classList.remove('on'));
  $(`tn-${view}`)?.classList.add('on');
}

function setSb(name) {
  document.querySelectorAll('.mi').forEach(el => {
    el.classList.toggle('on', el.dataset.mod === name);
  });
}

function showMain(on) {
  $('main').style.display       = on ? '' : 'none';
  $('graph-wrap').style.display = on ? 'none' : 'block';
}

// ── Deep linking ──────────────────────────────────────────────────────────────
const SEP = '|';

function buildHash(view, p) {
  if (view === 'module')    return `module${SEP}${p.n}`;
  if (view === 'class')     return `class${SEP}${p.n}`;
  if (view === 'file')      return `file${SEP}${encodeURIComponent(p.path)}${SEP}${p.mod||''}`;
  if (view === 'scenarios') return p.path ? `scenarios${SEP}${encodeURIComponent(p.path)}` : 'scenarios';
  if (view === 'search')    return p.q    ? `search${SEP}${encodeURIComponent(p.q)}`       : 'search';
  return view;
}

function goFromHash(hash) {
  if (!hash) { _render('home', {}); return; }
  const parts = hash.split(SEP);
  const view  = parts[0];
  if      (view === 'module')    _render('module',    { n: parts[1] });
  else if (view === 'class')     _render('class',     { n: parts[1] });
  else if (view === 'file')      _render('file',      { path: decodeURIComponent(parts[1]), mod: parts[2]||'' });
  else if (view === 'scenarios') _render('scenarios', { path: parts[1] ? decodeURIComponent(parts[1]) : '' });
  else if (view === 'search')    _render('search',    { q: parts[1] ? decodeURIComponent(parts[1]) : '' });
  else                           _render(view, {});
}

window.addEventListener('popstate', () => goFromHash(location.hash.slice(1)));

// ── Navigation ────────────────────────────────────────────────────────────────
function go(view, p = {}) {
  history.pushState(null, '', '#' + buildHash(view, p));
  _render(view, p);
}

function _render(view, p) {
  if (view !== 'esp' && view !== 'journal') {
    if (_espPollTimer)   { clearInterval(_espPollTimer); _espPollTimer = null; }
    if (_espEventSource) { _espEventSource.close(); _espEventSource = null; }
  }
  if (view !== 'graph' && view !== 'scenarios') showMain(true);

  switch(view) {
    case 'home':      setNav('home');      setSb(''); renderHome();                   break;
    case 'graph':     setNav('graph');     setSb(''); renderGraph();                  break;
    case 'scenarios': setNav('scenarios'); setSb(''); renderScenarios(p.path||'');    break;
    case 'classes':   setNav('classes');   setSb(''); renderClasses();                break;
    case 'analyse':   setNav('analyse');   setSb(''); renderAnalyse();                break;
    case 'prefabs':   setNav('prefabs');   setSb(''); renderRessources();             break;
    case 'esp':       setNav('esp');       setSb(''); renderEsp();                    break;
    case 'journal':   setNav('journal');   setSb(''); renderJournal();                break;
    case 'search':    setNav('search');    setSb(''); renderSearch(p.q||'');          break;
    case 'module':    setSb(p.n);          renderModule(p.n);                         break;
    case 'file':      renderFile(p.path, p.mod);                                      break;
    case 'class':     renderClass(p.n);                                               break;
  }
}

  const mdFiles = m.files.filter(f => f.endsWith('.md'));

    <!-- Classes -->
    <div id="t-cls">
      <ul class="cls-list">

          const reach2    = D.reachable ? new Set(D.reachable) : null;
          const ref2      = new Set(D.referenced || []);

          return m.classes.map(c => {

              ? `<span style="font-size:10px;padding:1px 5px;border-radius:4px;margin-left:5px;background:var(--border);color:var(--muted)">no doc</span>`
              : '';
            const fo = intraFOut[c.name] || 0;

              : '';
            return `

                : ''}
            </li>`;
          }).join('');
        })()}
      </ul>

    <!-- Fichiers -->

    <!-- Graphe interne -->

    <!-- Dépendances -->
    <div id="t-deps" style="display:none">

          <div class="cycle-t">&#9888; Impliqué dans ${mc.length} cycle${mc.length>1?'s':''}</div>

function fileRow(f, mod) {
  const fname = f.split('/').pop();
  const ext   = fname.split('.').pop();
  const dir   = f.split('/').slice(0,-1).join('/');
  return `<div class="fentry" onclick="go('file',{path:'${f}',mod:'${mod}'})">
    <span class="fext">.${ext}</span>
    <span>${fname}</span>
    <span class="fpath">${dir}</span>
  </div>`;
}

function docFileRow(f, mod) {
  const fname = f.split('/').pop();
  return `<div class="fentry" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:7px;flex:1;min-width:0;cursor:pointer"
         onclick="go('file',{path:'${f}',mod:'${mod}'})">
      <span class="fext">.md</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fname}</span>
    </div>
    <div style="display:flex;gap:4px;flex-shrink:0;margin-left:8px">
      <button class="gbtn" style="padding:2px 8px;font-size:11px"
              onclick="event.stopPropagation();openFileEdit('${f}','${mod}')">Éditer</button>
      <button class="gbtn" style="padding:2px 8px;font-size:11px;color:var(--red);border-color:var(--red)"
              onclick="event.stopPropagation();confirmDeleteDoc('${f}','${mod}')">✕</button>
    </div>
